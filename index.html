/* ── 押さえ方を決める（6弦か5弦にベース、そこから4フレットの幅で和音の音を拾う）── */
const _vcCache=new Map();
/* ギタリストが実際に弾く押さえ方。左が6弦。x は弾かない弦
   よく使うコードはローコード、ほかはバレーコード（6弦ルートのEの形・5弦ルートのAの形の、低いフレットの方）。
   形の決まっていないコード（dim・sus4・分数コードなど）は、下の計算で決める */
const VC_QUAL=[['maj',[0,4,7]],['m',[0,3,7]],['7',[0,4,7,10]],['m7',[0,3,7,10]],['maj7',[0,4,7,11]]];
const VC_OPEN={
  0:{maj:'x32010','7':'x32310',maj7:'x32000'},
  2:{maj:'xx0232',m:'xx0231','7':'xx0212',m7:'xx0211',maj7:'xx0222'},
  4:{maj:'022100',m:'022000','7':'020100',m7:'022030',maj7:'021100'},
  5:{maj7:'xx3210'},
  7:{maj:'320003','7':'320001',maj7:'320002'},
  9:{maj:'x02220',m:'x02210','7':'x02020',m7:'x02010',maj7:'x02120'},
  11:{'7':'x21202'}
};
const VC_E={maj:[0,2,2,1,0,0],m:[0,2,2,0,0,0],'7':[0,2,0,1,0,0],m7:[0,2,0,0,0,0],maj7:[0,null,1,1,0,null]};
const VC_A={maj:[null,0,2,2,2,0],m:[null,0,2,2,1,0],'7':[null,0,2,0,2,0],m7:[null,0,2,0,1,0],maj7:[null,0,2,1,2,0]};
function stdVoicing(p){
  if(p.bass!==p.root) return null;
  const key=p.iv.slice().sort((a,b)=>a-b).join(','), q=(VC_QUAL.find(x=>x[1].join(',')===key)||[])[0]; if(!q) return null;
  const fromStr=str=>{ const out=[]; for(let s=0;s<6;s++){ const c=str[s]; if(c!=='x') out.push({s,m:OPEN[s]+(+c)}); } return out; };
  const o=VC_OPEN[p.root]&&VC_OPEN[p.root][q]; if(o) return fromStr(o);
  const r6=((p.root-4)%12+12)%12, r5=((p.root-9)%12+12)%12;          /* 6弦・5弦で根音が出るフレット */
  const use6=r6<=r5, r=use6?r6:r5, sh=(use6?VC_E:VC_A)[q];
  const out=[]; sh.forEach((d,s)=>{ if(d!=null) out.push({s,m:OPEN[s]+r+d}); }); return out;
}
function guitarVoicing(name){
  if(_vcCache.has(name)) return _vcCache.get(name);
  const p=parseChord(name); if(!p) return [];
  const sv=stdVoicing(p); if(sv){ _vcCache.set(name,sv); return sv; }
  const pcs=[...new Set(p.iv.map(i=>(p.root+i)%12))];
  let best=null;
  [0,1,2].forEach(bs=>{
    const fb=((p.bass-OPEN[bs]%12)+12)%12; if(fb>9) return;
    const lo=Math.max(0,fb-2), hi=Math.max(fb+2,3);
    const notes=[{s:bs,m:OPEN[bs]+fb}], cov=new Set([p.bass]);
    for(let s=bs+1;s<6;s++){
      const cand=[];
      for(let fr=0;fr<=hi;fr++){ if(fr!==0&&fr<lo) continue; const pc=(OPEN[s]+fr)%12; if(pcs.includes(pc)) cand.push({fr,pc}); }
      if(!cand.length) continue;
      cand.sort((a,b)=>(cov.has(a.pc)-cov.has(b.pc))||(a.fr===0?-1:0)-(b.fr===0?-1:0)||a.fr-b.fr);
      notes.push({s,m:OPEN[s]+cand[0].fr}); cov.add(cand[0].pc);
    }
    const miss=pcs.filter(pc=>!cov.has(pc)).length;
    const score=miss*10+fb*0.4+bs*1.5+(notes.length<4?5:0);
    if(!best||score<best.score) best={score,notes};
  });
  const r=best?best.notes:[]; _vcCache.set(name,r); return r;
}

/* ════════ コード図（押さえの図）════════
   押さえは6弦→1弦のフレットの並び（null＝弾かない、0＝開放）。
   決め方：その箇所で決めた押さえ（c.v。決めた時のコード名 c.vc と同じ時だけ効く）→ 曲で決めた押さえ（s.voicings[コード名]）→ 自動。
   図で押さえを変えると、伴奏のギターもその押さえで鳴る（ピアノの伴奏は図だけ） */
function autoFrets(name){ const n=guitarVoicing(name); if(!n.length) return null; const fr=[null,null,null,null,null,null]; n.forEach(o=>{ fr[o.s]=o.m-OPEN[o.s]; }); return fr; }
function ownVoicing(s,c){ if(!c) return null; if(c.v&&c.vc===c.c) return c.v; const m=s&&s.voicings; return (m&&m[c.c])||null; }
function voicingOf(s,c){ return ownVoicing(s,c)||autoFrets(c.c); }
function fretNotes(fr){ const out=[]; (fr||[]).forEach((f,s)=>{ if(f!=null) out.push({s,m:OPEN[s]+f}); }); return out; }
const sameFr=(a,b)=>JSON.stringify(a||null)===JSON.stringify(b||null);
/* 図（縦向き。左が6弦） */
function dgmSvg(fr){
  if(!fr) return '';
  const fx=fr.filter(f=>f!=null&&f>0), mx=fx.length?Math.max(...fx):0, mn=fx.length?Math.min(...fx):0;
  const base=mx<=4?1:mn, rows=Math.max(4,Math.min(5,mx-base+1));
  const L=12, T=13, gx=7, gy=9.5, W=L+gx*5+8, H=T+gy*rows+4;
  const X=s=>L+s*gx, Y=f=>T+(f-base+0.5)*gy;
  let g=`<svg class="dgm" viewBox="0 0 ${W} ${H}" width="${(W*1.3).toFixed(1)}" height="${(H*1.3).toFixed(1)}" aria-hidden="true">`;
  for(let r=0;r<=rows;r++) g+=`<line x1="${X(0)}" y1="${T+r*gy}" x2="${X(5)}" y2="${T+r*gy}" stroke="#8a8f99" stroke-width=".8"/>`;
  for(let s=0;s<6;s++) g+=`<line x1="${X(s)}" y1="${T}" x2="${X(s)}" y2="${T+rows*gy}" stroke="#6b7079" stroke-width="${(1.15-s*0.07).toFixed(2)}"/>`;
  if(base===1) g+=`<rect x="${X(0)-.6}" y="${T-2.4}" width="${gx*5+1.2}" height="2.6" rx=".6" fill="#2b2e34"/>`;
  else g+=`<text x="${L-3.5}" y="${T+gy*0.5+3}" text-anchor="end" font-size="7" font-weight="700" fill="#4b5058">${base}</text>`;
  /* セーハ：いちばん低いフレットを、そこから1弦側へ切れ目なく押さえている時 */
  let barre=null;
  if(mn>0){ const idx=fr.map((f,i)=>f===mn?i:-1).filter(i=>i>=0);
    if(idx.length>=2){ const a=idx[0], b=idx[idx.length-1]; let ok=true; for(let i=a;i<=b;i++) if(fr[i]==null||fr[i]<mn) ok=false;
      if(ok&&b-a>=2) barre={a,b}; } }
  if(barre) g+=`<rect x="${X(barre.a)-3.1}" y="${Y(mn)-3.1}" width="${X(barre.b)-X(barre.a)+6.2}" height="6.2" rx="3.1" fill="#2b2e34"/>`;
  fr.forEach((f,s)=>{ const x=X(s);
    if(f==null) g+=`<path d="M${x-2.2} ${T-8.6}l4.4 4.4M${x+2.2} ${T-8.6}l-4.4 4.4" stroke="#6b7079" stroke-width="1.1" stroke-linecap="round"/>`;
    else if(f===0) g+=`<circle cx="${x}" cy="${T-6.4}" r="2.3" fill="none" stroke="#2b2e34" stroke-width="1"/>`;
    else if(!(barre&&f===mn&&s>=barre.a&&s<=barre.b)) g+=`<circle cx="${x}" cy="${Y(f)}" r="3.1" fill="#2b2e34"/>`; });
  return g+'</svg>';
}
/* 曲の中のコードの置き場所を探す */
function chordAtPlace(s,p){ for(const sec of s.sections){ const b=sec.bars.find(x=>x.id===p.barId); if(b) return b.chords.find(c=>c.t===p.t)||null; } return null; }
/* 曲名の下：「コード＋押さえ」ごとに、初めて出る順で並べる */
function renderDgmTop(){
  const el=$('dgmTop'), s=song(); if(!el||!s) return;
  if(s.diagram!=='top'){ el.innerHTML=''; el.classList.add('hide'); return; }
  const list=[];
  flatBars(s).forEach(({b})=>b.chords.slice().sort((x,y)=>x.t-y.t).forEach(c=>{ const v=voicingOf(s,c); if(!v) return;
    let it=list.find(x=>x.c===c.c&&sameFr(x.v,v)); if(!it){ it={c:c.c,v,places:[]}; list.push(it); } it.places.push({barId:b.id,t:c.t}); }));
  el.classList.toggle('hide',!list.length);
  el.innerHTML=list.map((x,i)=>`<button class="dgmb top" data-dgi="${i}" title="${esc(x.c)} の押さえを変える"><span class="dgmn">${esc(x.c)}</span>${dgmSvg(x.v)}</button>`).join('');
  el.querySelectorAll('[data-dgi]').forEach(b=>b.onclick=()=>{ const x=list[+b.dataset.dgi]; openVoicingEditor(s,x.places,'here'); });
}
/* 押さえを変える画面。places＝変える箇所。〈この箇所だけ〉が既定、〈この曲のこのコード全部〉にも切り替えられる */
function openVoicingEditor(s,places,scope){
  const c0=places.length&&chordAtPlace(s,places[0]); if(!c0) return;
  const name=c0.c, auto=autoFrets(name);
  const ve={frets:(voicingOf(s,c0)||[null,null,null,null,null,null]).slice(),scope:scope||'here'};
  const cols=5, sx=44, sy=26, padL=42, padR=16, padT=18, padB=30, gw=cols*sx, gh=5*sy, W=padL+gw+padR, H=padT+gh+padB;
  const baseOf=()=>{ const fx=ve.frets.filter(f=>f!=null&&f>0); const mx=fx.length?Math.max(...fx):0; return mx<=cols?1:Math.min(...fx); };
  ve.bf=baseOf();
  const board=()=>{ const bf=ve.bf, x0=padL, y0=padT, rowY=i=>y0+(5-i)*sy, colX=f=>x0+(f-bf+0.5)*sx;
    let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:360px;display:block"><rect width="${W}" height="${H}" rx="8" fill="#fff"/>`;
    for(let c=0;c<=cols;c++) g+=`<line x1="${x0+c*sx}" y1="${y0}" x2="${x0+c*sx}" y2="${y0+gh}" stroke="#c9ccd3" stroke-width="1.1"/>`;
    for(let i=0;i<6;i++){ g+=`<line x1="${x0}" y1="${rowY(i)}" x2="${x0+gw}" y2="${rowY(i)}" stroke="#b9bdc6" stroke-width="${1+(5-i)*0.28}"/>`;
      g+=`<text x="${x0-26}" y="${rowY(i)+4}" text-anchor="middle" font-size="11" fill="#9aa0ab">${6-i}弦</text>`; }
    if(bf<=1) g+=`<rect x="${x0-4}" y="${y0-2}" width="4" height="${gh+4}" fill="#1f2937"/>`;
    for(let c=0;c<cols;c++) g+=`<text x="${x0+(c+0.5)*sx}" y="${y0+gh+24}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9aa0ab">${bf+c}</text>`;
    for(let i=0;i<6;i++){ const f=ve.frets[i], y=rowY(i), x=x0-10;
      if(f==null) g+=`<path d="M${x-5} ${y-5}L${x+5} ${y+5}M${x+5} ${y-5}L${x-5} ${y+5}" stroke="#9aa0ab" stroke-width="2"/>`;
      else if(f===0) g+=`<circle cx="${x}" cy="${y}" r="5.4" fill="none" stroke="#1f2937" stroke-width="1.8"/>`;
      else if(f>=bf&&f<bf+cols) g+=`<circle cx="${colX(f)}" cy="${y}" r="10" fill="#1f2937"/>`;
      g+=`<rect class="vch" data-s="${i}" data-f="-1" x="${x0-34}" y="${y-sy/2}" width="34" height="${sy}" fill="transparent"/>`;
      for(let c=0;c<cols;c++) g+=`<rect class="vch" data-s="${i}" data-f="${bf+c}" x="${x0+c*sx}" y="${y-sy/2}" width="${sx}" height="${sy}" fill="transparent"/>`; }
    return g+'</svg>'; };
  const n=places.length;
  const body=()=>`<div class="vcbd">${board()}</div>
    <p class="snote">弦を押すとフレットが決まり、もう一度で外れます。左端で ○（開放）と ×（弾かない）が入れ替わります。</p>
    <div class="btns"><button class="tb" id="vDn">◀ 1フレット下げる</button><button class="tb" id="vUp">1フレット上げる ▶</button><button class="tb" id="vAuto">形を自動に戻す</button><button class="tb" id="vPlay">鳴らす</button></div>
    <div class="btns"><span class="seg"><button class="${ve.scope==='here'?'on':''}" data-vsc="here">${n>1?`この押さえの所だけ（${n}か所）`:'この箇所だけ'}</button><button class="${ve.scope==='song'?'on':''}" data-vsc="song">この曲のこのコード全部</button></span></div>
    ${accInstOf()==='piano'?'<p class="snote">伴奏がピアノの間は、図だけが変わります。</p>':''}
    <div class="btns"><button class="tb pri" id="vOk">決める</button><button class="tb" id="vCancel">やめる</button></div>`;
  sheet(`<h2>${esc(name)} の押さえ</h2><div id="vBody">${body()}</div>`,sh=>{
    const redraw=()=>{ sh.querySelector('#vBody').innerHTML=body(); bind(); };
    const bind=()=>{
      sh.querySelectorAll('.vch').forEach(h=>h.onclick=()=>{ const si=+h.dataset.s, f=+h.dataset.f;

        ve.frets=f; ve.bf=baseOf(); redraw(); };
      sh.querySelector('#vDn').onclick=()=>shift(-1); sh.querySelector('#vUp').onclick=()=>shift(1);
      sh.querySelector('#vAuto').onclick=()=>{ if(auto){ ve.frets=auto.slice(); ve.bf=baseOf(); redraw(); } };
      sh.querySelector('#vPlay').onclick=()=>{ if(audio()) strumAt(ac.currentTime+0.03,name,'D',1,1,ve.frets); };
      sh.querySelectorAll('[data-vsc]').forEach(b=>b.onclick=()=>{ ve.scope=b.dataset.vsc; redraw(); });
      sh.querySelector('#vCancel').onclick=closeSheet;
      sh.querySelector('#vOk').onclick=()=>{
        if(!ve.frets.some(f=>f!=null)) return toast('1本以上の弦を押さえてください');
        const fr=ve.frets.slice();
        if(ve.scope==='song'){ s.voicings=s.voicings||{};
          if(sameFr(fr,auto)) delete s.voicings[name]; else s.voicings[name]=fr;
          flatBars(s).forEach(({b})=>b.chords.forEach(c=>{ if(c.c===name){ delete c.v; delete c.vc; } })); }
        else { const songV=(s.voicings&&s.voicings[name])||auto;

/* ════════ ピアノロール（動かせる小窓・白い紙）════════
   縦が音の高さ（五線譜に書いた高さ）、横が時間。小節の幅は拍の数に比べる（テンポでは変えない）。
   伴奏のコードの音は、そのコードが鳴っている間だけ薄い帯で重ねる。
   開いているか・位置・大きさ・横の拡大はこの端末に覚える */
const PR={rh:18, kw:58, hh:40};
const PR_SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'], PR_FLAT=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
function prFlat(sec){ const k=sec.minor?({Dm:'F',Gm:'Bb',Cm:'Eb',Fm:'Ab',Bbm:'Db',Ebm:'Gb'})[sec.key+'m']:sec.key; return ['F','Bb','Eb','Ab','Db','Gb'].includes(k||sec.key); }
function prBarQ(ts){ const [n,d]=ts.split('/').map(Number); return n*4/d; }   /* 小節の長さ（四分音符いくつ分） */
function prModel(s){
  const pxq=uiPref().prZoom||56, bars=[], notes=[], bands=[];
  let x=0, lo=127, hi=0;
  const F=flatBars(s);
  F.forEach(({sec,b},gi)=>{ const q=prBarQ(sec.ts), w=q*pxq;
    bars.push({id:b.id,gi,x,w,ts:sec.ts,q,flat:prFlat(sec)});
    (b.notes||[]).forEach(n=>{ if(n.kind==='rest') return;
      (n.stops||[]).forEach(o=>{ if(typeof o.f!=='number') return; const m=OPEN[o.s]+o.f+12;
        lo=Math.min(lo,m); hi=Math.max(hi,m);
        notes.push({x:x+n.start/TPQ*pxq,w:Math.max(4,n.len/TPQ*pxq),m,flat:prFlat(sec),tie:!!(o.t&&o.t.link==='tie')}); }); });
    x+=w; });
  /* コードの区切り（食いは八分ひとつ前から。鳴り方と同じ） */
  const pts=[]; F.forEach(({sec,b},gi)=>{ const B=bars[gi]; b.chords.forEach(c=>{ const at=B.x+Math.max(0,(c.t-(c.syn?1:0)))*pxq/2; pts.push({x:gi===0?Math.max(0,at):at,c:c.c}); }); });
  pts.sort((a,b)=>a.x-b.x);
  pts.forEach((p,i)=>{ const e=i+1<pts.length?pts[i+1].x:x, cp=chordPcs(p.c); if(cp&&e>p.x) bands.push({x:p.x,w:e-p.x,c:p.c,set:cp.set}); });
  if(hi<lo){ lo=60; hi=84; }

function melEvents(sec,bar,barT,spt){
  const out=[], notes=(bar.notes||[]).slice().sort((a,b)=>a.start-b.start);
  notes.forEach((n,i)=>{
    if(n.kind==='rest') return;
    const sym=n.sym||{}, at=barT+n.start*spt;
    let dur=n.len*spt;
    // タイ：次の音が同じ弦でタイなら、長さを足して次は鳴らさない
    (n.stops||[]).forEach(o=>{
      if(typeof o.f!=='number'&&o.f!=='x') return;
      const t=o.t||{};
      if(t.link==='tie') return;                  // 前の音の続きなので、あらためては鳴らさない
      let d=dur;
      for(let j=i+1;j<notes.length;j++){ const nx=notes[j], m=(nx.stops||[]).find(y=>y.s===o.s);
        if(!m||!(m.t&&m.t.link==='tie')) break; d+=nx.len*spt; }
      const mute=o.f==='x'||t.mute;
      let midi=mute?OPEN[o.s]+4:OPEN[o.s]+(+o.f||0);
      if(t.harm) midi+=12;
      const prev=(()=>{ for(let j=i-1;j>=0;j--){ const m=(notes[j].stops||[]).find(y=>y.s===o.s&&typeof y.f==='number'); if(m) return {n:notes[j],o:m}; }
        for(let j=i-1;j>=0;j--){ const m=(notes[j].stops||[]).find(y=>typeof y.f==='number'); if(m) return {n:notes[j],o:m}; } return null; })();
      const opt={noPick:['h','p','leg','sl','gl','bd','tie'].includes(t.link),mute,pm:sym.pm,ring:sym.ring,staccato:n.staccato};
      let amp=0.30*(n.accent?1.35:1)*(mute?0.6:1)*(t.harm?0.7:1)*(sym.rake?0.85:1);
      if(t.link==='sl'||t.link==='gl'){ if(prev){ opt.from=(OPEN[prev.o.s]+prev.o.f)-midi; opt.to=0; opt.glideDur=Math.min(0.18,d*0.5); } }
      if(t.bend&&t.bend.amt>0){ const b=bendSemi(t.bend.amt);
        if(t.bend.pre){ opt.from=b; opt.to=b; } else { opt.from=0; opt.to=b; opt.glideDelay=d*0.15; opt.glideDur=Math.min(0.4,d*0.4); } }
      if(t.link==='bd'&&prev){ const pb=((prev.o.t||{}).bend||{}).amt; opt.from=bendSemi(pb||1); opt.to=0; opt.glideDur=Math.min(0.35,d*0.5); }
      if(t.vib) opt.vib=VIB_DEPTH[t.vib]||1;
      if(sym.arm==='dive'){ opt.from=opt.from||0; opt.to=-4; opt.glideDelay=d*0.4; opt.glideDur=d*0.5; }
      opt.oct=ottPlay(bar,n.start);
      if(t.grace&&t.grace.f!=null) out.push({t:Math.max(0,at-0.09),midi:OPEN[o.s]+(+t.grace.f),v:amp*0.7,s:o.s,d:0.1,o:{noPick:false,oct:opt.oct}});
      if(sym.trem){ const step=Math.max(0.07,d/Math.max(2,Math.round(d/0.09)));
        for(let x=0;x<d-0.01;x+=step) out.push({t:at+x,midi,v:amp*0.8,s:o.s,d:step,o:Object.assign({},opt,{noPick:false})}); }
      else if(t.trill!=null&&t.trill!==''){ const other=OPEN[o.s]+(+t.trill||0), step=Math.max(0.08,d/Math.max(2,Math.round(d/0.1)));

      else out.push({t:at,midi,v:amp,s:o.s,d,o:opt});
    });
  });

}

/* ════════ メロディの入力（第2段階 2-2）════════ */
const DURS=[[T.WHOLE,'全音符'],[T.HALF,'2分'],[T.QUARTER,'4分'],[T.EIGHTH,'8分'],[T.SIXTEENTH,'16分'],[T.THIRTY2,'32分']];
const SNAPS=[['q4',T.QUARTER,'4分'],['e8',T.EIGHTH,'8分'],['s16',T.SIXTEENTH,'16分'],['t8',T.TRIP8,'3連']];
const MI={tab:'chord',mode:'input',pen:'note',stamp:null,stampMode:'full',fb:'',fbT:0,fbCell:null,cur:null,snap:'e8',adv:false,acc:null,multi:false,picked:new Set(),board:false};
function lenName(u){
  const base=[[T.WHOLE,'全音符'],[T.HALF,'2分'],[T.QUARTER,'4分'],[T.EIGHTH,'8分'],[T.SIXTEENTH,'16分'],[T.THIRTY2,'32分']];
  for(const [v,nm] of base){ if(u===v) return nm; if(u===Math.round(v*1.5)) return '付点'+nm; if(u===Math.round(v*2/3)) return nm+'の3連'; }

}
/* 置く長さは、そのマスの長さ（後始末の休符の割り方と刻みで決まる）。
   長さを変えたい時は、なぞるか、音符の〈長さ〉から選ぶ。 */
function curLen(){
  const sec=section(), c=curBar();
  if(!sec||!c) return snapTicks();
  const cl=cellAt(sec,c.bar,MI.cur.tick);
  return Math.max(1,cl.end-cl.start);
}
function snapTicks(){ return SNAPS.find(x=>x[0]===MI.snap)[1]; }
function barTicksOf(sec){ const ts=tsObj(sec.ts); return Math.round(4/ts.d*TPQ)*ts.n; }
function nid(){ return 'n'+uid(); }
/* 描いた絵の縦の範囲（staffSvg / tabSvg と同じ数字） */
function melGeom(view,el){ const SP=MEL_SP; if(view==='tab') return {top:0,h:tabG().H};
  const sv=el&&el.querySelector&&el.querySelector('svg.msvg'), vb=sv&&sv.viewBox&&sv.viewBox.baseVal;
  return vb&&vb.height?{top:vb.y,h:vb.height,midY:8.6*SP}:{top:2.4*SP,h:12.4*SP,midY:8.6*SP}; }

/* ── 音の高さ・弦とフレット ── */
const LETTER_PC=[0,2,4,5,7,9,11];
function keyAlter(ks){ const a=[0,0,0,0,0,0,0];
  if(ks>0) [3,0,4,1,5,2,6].slice(0,ks).forEach(i=>a[i]=1); if(ks<0) [6,2,5,1,4,0,3].slice(0,-ks).forEach(i=>a[i]=-1); return a; }
function stepToMidi(st,ks,acc){       // 五線の段（34＝第3線のシ）→ 鳴る音（ギターは1オクターブ下）
  const li=((st%7)+7)%7, oct=Math.floor(st/7);
  const alt=acc==null?keyAlter(ks)[li]:acc;
  return (oct+1)*12+LETTER_PC[li]+alt-12;
}
const MAX_FRET=22;
function fretFor(midi,near){
  let best=null;
  for(let s=0;s<6;s++){ const f=midi-OPEN[s]; if(f<0||f>MAX_FRET) continue;
    const cost=(near==null?f*0.6:Math.abs(f-near))+(f>12?2:0)+(f===0&&near!=null&&near>4?1.5:0);
    if(!best||cost<best.cost) best={s,f,cost}; }

}
function lastFretBefore(bar,tick){
  const prev=(bar.notes||[]).filter(n=>n.kind!=='rest'&&n.start<tick&&n.stops&&n.stops.length).sort((a,b)=>b.start-a.start)[0];
  return prev?prev.stops.map(o=>typeof o.f==='number'?o.f:0).reduce((a,b)=>Math.max(a,b),0):null;
}
function midiOf(o){ return OPEN[o.s]+o.f; }

/* ── 音符を置く ── */
function curBar(){ if(!MI.cur) return null; const sec=secOfBar(MI.cur.barId); if(!sec) return null; if(S.secId!==sec.id) S.secId=sec.id; const bi=sec.bars.findIndex(b=>b.id===MI.cur.barId); return {sec,bar:sec.bars[bi],bi}; }
function putNote(stop,isRest){
  const c=curBar(); if(!c) return toast('先にメロディの段を押して、入れる位置を選んでください');
  const {sec,bar,bi}=c, total=barTicksOf(sec), at=MI.cur.tick;
  MI.lastPut={barId:bar.id,tick:at};
  const same=bar.notes.find(n=>n.start===at);
  const len=Math.min(curLen(),total-at);
  if(!isRest&&same&&same.kind!=='rest'&&!MI.adv_replace){
    // 同じ位置の音符に重ねる（別の弦なら和音、同じ弦なら差し替え）
    const i=same.stops.findIndex(o=>o.s===stop.s);
    if(i>=0) same.stops[i]=Object.assign(same.stops[i],{f:stop.f}); else same.stops.push(Object.assign({t:{}},stop));
    same.stops.sort((a,b)=>a.s-b.s);
    if(same.len!==len&&MI.lenTouched) same.len=len;
    MI.cur.s=stop.s; touch(song()); preview(stop); afterPut(same.len); return;
  }
  // 重なる音符を整える：あとから始まる音は消し、前から伸びている音は手前で切る
  bar.notes=bar.notes.filter(n=>!(n.start>=at&&n.start<at+len));
  bar.notes.forEach(n=>{ if(n.start<at&&n.start+n.len>at) n.len=at-n.start; });
  const n={id:nid(),start:at,len,kind:isRest?'rest':'note',stops:isRest?[]:[Object.assign({t:{}},stop)],sym:{},lyric:null};
  bar.notes.push(n); bar.notes.sort((a,b)=>a.start-b.start);
  MI.putBarId=bar.id; MI.putTick=at; tidyBar(sec,bar);
  if(!isRest){ MI.cur.s=stop.s; preview(stop); }
  touch(song()); ottHint(bar,stop); afterPut(len);
}
/* 加線が四本以上になったら、8va を勧める（知らせるのは小節ごとに一度だけ） */
const ottTold=new Set();
function ottHint(bar,stop){
  if(!stop||bar.ott||typeof stop.f!=='number'||melVoiceOf()!=='guitar') return;
  if(OPEN[stop.s]+stop.f<79) return;                 /* 五線の上に加線四本ぶん */
  if(ottTold.has(bar.id)) return; ottTold.add(bar.id);
  toast('高い音で加線が増えています。小節の設定から 8va を付けると、譜面が読みやすくなります',5000);
}
function afterPut(len){
  MI.lenTouched=false;
  if(MI.adv){
    const {sec,bi}=curBar(), total=barTicksOf(sec); let t=MI.cur.tick+len;
    if(t>=total){ const nx=flatAt(sec,bi,1); if(nx){ MI.cur={barId:nx.b.id,tick:0,s:MI.cur.s}; S.secId=nx.sec.id; } else t=total-1; }
    if(t<total&&MI.cur.barId===sec.bars[bi].id) MI.cur.tick=t;
  }
  renderBars(); renderMelDock();
}
function preview(stop){ if(stop&&typeof stop.f==='number'&&audio()) pluck(ac.currentTime+0.02,OPEN[stop.s]+stop.f,0.24,stop.s); }
function noteAtCursor(){ const c=curBar(); return c&&c.bar.notes.find(n=>n.start===MI.cur.tick); }
function deleteNotes(){
  const sec=section(); if(!sec) return;
  let n=0;
  if(MI.picked.size){ song().sections.forEach(sg=>sg.bars.forEach(b=>{ const k=b.notes.length; b.notes=b.notes.filter(x=>!MI.picked.has(x.id)); n+=k-b.notes.length; if(k!==b.notes.length) tidyBar(sg,b); })); MI.picked.clear(); }
  else { const c=curBar(), x=noteAtCursor(); if(c&&x){ c.bar.notes=c.bar.notes.filter(y=>y!==x); n=1; } }
  if(!n) return toast('消す音符がありません');
  sec.bars.forEach(b=>tidyBar(sec,b));
  touch(song()); renderBars(); renderMelDock();
}

/* ── 譜面を押した位置を読む ── */
/* ── なぞって音価を決める（ScoreLineTAB と同じ考え方）──
   ・音符を押して横へ引くと、その音符の長さが決まる（刻みで丸める）
   ・頭より左へ引くと、頭が前へ伸びる（間にあるものは飲み込む）
   ・小節線を越えた分は、次の小節の頭が休符なら割って置き、タイで繋ぐ
   ・何も無い所から引くと、まず音符を置いてから長さを決める
   ・下の帯の音価はそのまま（なぞりはその音符だけに効く） */
function clearSpan(bar,st,en,keep){
  bar.notes=bar.notes.filter(n=>n===keep||n.start>=en||n.start+n.len<=st);
}
function setNoteLen(sec,bar,idx,len){
  const total=barTicksOf(sec), n=bar.notes[idx]; if(!n) return;
  len=Math.max(4,Math.min(total-n.start,Math.round(len)));
  clearSpan(bar,n.start,n.start+len,n);
  n.len=len;
  bar.notes.sort((a,b)=>a.start-b.start); tidyBar(sec,bar);
}
function moveNoteHead(sec,bar,idx,st){
  const n=bar.notes[idx]; if(!n) return false;
  const end=n.start+n.len;
  st=Math.max(0,Math.min(end-1,Math.round(st)));
  if(st>=n.start) return false;
  clearSpan(bar,st,end,n);
  n.start=st; n.len=end-st;
  (n.stops||[]).forEach(o=>{ if(o&&o.t){ delete o.t.link; } });
  bar.notes.sort((a,b)=>a.start-b.start); tidyBar(sec,bar);
  return true;
}
/* 越えた分を次の小節へ。次の小節の頭が休符で、越えた分が収まる時だけ置く */
function setLenAcross(sec,bi,idx,len){
  const bar=sec.bars[bi], total=barTicksOf(sec), n=bar.notes[idx];
  if(!n||n.kind==='rest') return 0;
  const room=total-n.start, over=len-room; if(over<=0) return 0;
  const nb=sec.bars[bi+1]; if(!nb) return 0;
  const head=(nb.notes||[]).slice().sort((a,b)=>a.start-b.start)[0];
  if(!head||head.kind!=='rest'||head.start!==0||head.len<over) return 0;
  const tail=head.len-over;
  nb.notes=nb.notes.filter(m=>m!==head);
  nb.notes.push({id:nid(),start:0,len:over,kind:'note',
    stops:(n.stops||[]).map(o=>({s:o.s,f:o.f,t:{link:'tie'}})),sym:{},lyric:null});
  if(tail>0) nb.notes.push({id:nid(),start:over,len:tail,kind:'rest',stops:[],sym:{},lyric:null});
  nb.notes.sort((a,b)=>a.start-b.start);
  setNoteLen(sec,bar,idx,room);
  return over;
}
function tickAtX(sec,bar,head,el,clientX){
  const r=el.getBoundingClientRect(); if(!r.width) return 0;
  const L=melLayout(sec,head), total=barTicksOf(sec);
  const x=(clientX-r.left)/r.width*MEL_W;
  return (x-L.padL-L.HEAD_OFF)/L.innerW*total;
}
/* ── 選んだ範囲のコピー・貼り付け・複製、小節の入れ替え・複製 ── */
const CLIP={notes:null,chords:null,len:0,label:''};
/* 〈選択〉で選んだ音符の、続きの範囲（頭から終わりまで） */
function pickedRange(sec){
  if(!MI.picked.size) return null;
  let bar=null, st=1e9, en=-1;
  sec.bars.forEach(b=>(b.notes||[]).forEach(n=>{ if(!MI.picked.has(n.id)) return;
    if(!bar) bar=b; if(b!==bar) return;
    st=Math.min(st,n.start); en=Math.max(en,n.start+n.len); }));
  return bar?{bar,bi:sec.bars.indexOf(bar),st,en}:null;
}
function copyRange(){
  const sec=section(); if(!sec) return;
  const R=pickedRange(sec)||(MI.cur?(()=>{ const c=curBar(); if(!c) return null;
    const cl=cellAt(sec,c.bar,MI.cur.tick); return {bar:c.bar,bi:c.bi,st:cl.start,en:cl.end}; })():null);
  if(!R) return toast('コピーする範囲がありません。〈選択〉で音符を選んでください');
  CLIP.len=R.en-R.st;
  CLIP.notes=(R.bar.notes||[]).filter(n=>n.start>=R.st&&n.start+n.len<=R.en)
    .map(n=>JSON.parse(JSON.stringify(Object.assign({},n,{start:n.start-R.st}))));
  const c0=Math.floor(R.st/(TPQ/2)), c1=Math.ceil(R.en/(TPQ/2));
  CLIP.chords=(R.bar.chords||[]).filter(c=>c.t>=c0&&c.t<c1).map(c=>({t:c.t-c0,c:c.c,syn:c.syn}));
  CLIP.label=`${R.bi+1}小節目の${CLIP.notes.length}音`;
  toast('コピーしました（'+CLIP.label+'）');
  renderMelDock();
}
function pasteClip(){
  const sec=section(), c=curBar();
  if(!CLIP.notes||!CLIP.notes.length&&!CLIP.chords.length) return toast('貼り付けるものがありません');
  if(!c) return toast('貼り付ける位置を、譜面を押して選んでください');
  const total=barTicksOf(sec), at=MI.cur.tick, len=Math.min(CLIP.len,total-at);
  c.bar.notes=(c.bar.notes||[]).filter(n=>n.start+n.len<=at||n.start>=at+len);
  c.bar.notes.forEach(n=>{ if(n.start<at&&n.start+n.len>at) n.len=at-n.start; });
  CLIP.notes.forEach(n=>{ const st=at+n.start; if(st>=total) return;
    c.bar.notes.push(Object.assign(JSON.parse(JSON.stringify(n)),{id:nid(),start:st,len:Math.min(n.len,total-st)})); });
  c.bar.notes.sort((a,b)=>a.start-b.start); tidyBar(sec,c.bar);
  const cellAtT=Math.round(at/(TPQ/2));
  (CLIP.chords||[]).forEach(ch=>{ const t=cellAtT+ch.t; if(t>=tsInfo(sec.ts).cells) return;
    c.bar.chords=c.bar.chords.filter(x=>x.t!==t); c.bar.chords.push({t,c:ch.c,syn:ch.syn}); });
  touch(song()); renderBars(); renderMelDock(); renderGuide();
}
function duplicateRange(){
  const sec=section(), R=pickedRange(sec)||(()=>{ const c=curBar(); if(!c) return null;
    const cl=cellAt(sec,c.bar,MI.cur?MI.cur.tick:0); return {bar:c.bar,bi:c.bi,st:cl.start,en:cl.end}; })();
  if(!R) return toast('複製する範囲がありません');
  copyRange();
  const total=barTicksOf(sec), at=R.en;
  if(at>=total) return toast('この小節には、複製を置く余りがありません');
  MI.cur={barId:R.bar.id,tick:at,s:MI.cur?MI.cur.s:null};
  pasteClip();
}
/* 小節ごと：入れ替え・複製・消す */
function moveBar(sec,from,to){
  if(to<0||to>=sec.bars.length||from===to) return;
  const [b]=sec.bars.splice(from,1); sec.bars.splice(to,0,b);
}
function dupBar(sec,bi){
  const c=JSON.parse(JSON.stringify(sec.bars[bi])); c.id=uid();
  (c.notes||[]).forEach(n=>n.id=nid());
  sec.bars.splice(bi+1,0,c);
}
/* ── 音符を動かす（長押ししてからドラッグ）──
   横：置き場所を動かす（マスに合わせる）　縦：TABは弦、五線譜は高さ */
/* 掴んだ音符を動かす。
   休符の上へ：指のマスへそのまま移す（空いた所は休符になる。休符の幅に収まらなければ収まる所まで寄せる）。
   音符の上へ：その音符と入れ替える。間にある音符・休符は、長さの差のぶんだけ前後にずれる。 */
/* 歌詞は並び順の位置に残す：音符を動かしても、左から何番目の歌詞かは変えない */
function lyricSeq(bar){ return (bar.notes||[]).filter(x=>x.kind!=='rest'&&x.stops&&x.stops.length&&!x.stops.every(o=>o.t&&o.t.link==='tie')).sort((a,b)=>a.start-b.start); }
function reorderNoteTo(sec,bar,n,tick){
  const lyr=lyricSeq(bar).map(x=>x.lyric||null);
  const moved=reorderNoteCore(sec,bar,n,tick);
  if(moved){ const seq=lyricSeq(bar); if(seq.length===lyr.length) seq.forEach((x,i)=>{ x.lyric=lyr[i]; }); }
  return moved;
}
function reorderNoteCore(sec,bar,n,tick){
  const total=barTicksOf(sec), items=(bar.notes||[]).slice().sort((a,b)=>a.start-b.start);
  const i=items.indexOf(n); if(i<0) return false;
  let j=items.findIndex(x=>tick>=x.start&&tick<x.start+x.len); if(j<0) j=items.length-1;
  if(j===i) return false;
  const tgt=items[j];
  if(tgt.kind==='rest'){
    const others=items.filter(x=>x!==n&&x.kind!=='rest');
    const edges=cellEdges(sec,bar); let st=0; edges.forEach(u=>{ if(u<=tick) st=Math.max(st,u); });
    /* 指のあたりの空き（前の音符の終わり〜次の音符の頭。自分の元の場所も空きとみなす） */
    let lo=0, hi=total;
    others.forEach(x=>{ const e=x.start+x.len; if(e<=tick) lo=Math.max(lo,e); if(x.start>tick) hi=Math.min(hi,x.start); });
    if(hi-lo<n.len) return false;
    st=Math.max(lo,Math.min(st,hi-n.len));
    if(st===n.start) return false;
    bar.notes=items.filter(x=>x===n||x.kind!=='rest'||x.start+x.len<=st||x.start>=st+n.len);
    n.start=st; bar.notes.sort((a,b)=>a.start-b.start); tidyBar(sec,bar); return true;
  }
  items[i]=tgt; items[j]=n;
  const from=Math.min(items[Math.min(i,j)].start,n.start,tgt.start);
  let at=from; items.slice(Math.min(i,j)).forEach(x=>{ x.start=at; at+=x.len; });
  bar.notes=items; return true;
}
function moveNoteTo(sec,bar,n,st){
  st=Math.max(0,Math.min(barTicksOf(sec)-1,Math.round(st)));
  if(st===n.start) return;
  const len=Math.min(n.len,barTicksOf(sec)-st);
  bar.notes=bar.notes.filter(x=>x===n||x.start+x.len<=st||x.start>=st+len);
  bar.notes.forEach(x=>{ if(x!==n&&x.start<st&&x.start+x.len>st) x.len=st-x.start; });
  n.start=st; n.len=len; bar.notes.sort((a,b)=>a.start-b.start); tidyBar(sec,bar);
}
/* 半音ずつ上下（押さえは近いフレットで選び直す） */
function shiftNoteSemi(n,d){
  (n.stops||[]).forEach(o=>{ if(typeof o.f!=='number') return;
    const midi=OPEN[o.s]+o.f+d, pos=fretFor(midi,o.f); if(pos){ o.s=pos.s; o.f=pos.f; } });
  (n.stops||[]).sort((a,b)=>a.s-b.s);
}
function shiftNotePitch(sec,bar,n,dStr,dStep){
  const ks=keySigOf(sec);
  (n.stops||[]).forEach(o=>{
    if(typeof o.f!=='number') return;
    if(dStr){                                   /* 弦を移す：鳴る音はそのまま保つ */
      const ns=Math.max(0,Math.min(5,o.s+dStr)), f=OPEN[o.s]+o.f-OPEN[ns];
      if(f>=0&&f<=MAX_FRET){ o.s=ns; o.f=f; }
    }else if(dStep){                            /* 五線の上下：線と間ひとつぶん（キーの音階に沿う） */
      let st;
      try{ st=SRR.spell(OPEN[o.s]+o.f+12,ks).absStep; }catch(e){ st=null; }
      if(st==null) return;
      const midi=stepToMidi(st+dStep,ks,null), pos=fretFor(midi,o.f);
      if(pos){ o.s=pos.s; o.f=pos.f; }
    }
  });
  n.stops.sort((a,b)=>a.s-b.s);
}
/* ════════ 譜面の上の手つき（ScoreLineTAB と同じ）════════
   縦になぞる … フレットが変わる（9px で1フレット）。音符の無い所なら、その場に音符が生まれる。
                0 より下へ引き切ると、その弦の押さえが消える。五線譜では半音ずつ上下する。
   横になぞる … 長さ（右へ末尾・左へ頭・小節線を越えればタイ）。休符の筆なら、その範囲が休符。
   縦と横は、先に動いた向きで決まり、指を離すまで入れ替わらない。
   長押し     … 〈入力〉では奏法の輪。〈選ぶ〉〈選択〉では音符を動かす。
   右クリック・二本指タップ … 音符と休符の筆を持ち替える。 */
const FRET_PX=9, LP_MS=620, DEL_MARGIN=2;
const TOUCHES=new Set();
let GD=null;                                   /* いま進んでいる手つき */
function togglePen(){
  MI.pen=MI.pen==='rest'?'note':'rest'; MI.stamp=null;
  toast(MI.pen==='rest'?'休符を置きます':'音符を置きます');
  renderBars(); renderMelDock();
}
/* 五線譜で、その音符の符頭が書かれている高さ（線・間の番号）。和音なら全部 */
function noteSteps(sec,bar,n){ const ks=keySigOf(sec)|0, out=[];
  (n.stops||[]).forEach(o=>{ if(typeof o.f!=='number') return; try{ out.push(SRR.spell(OPEN[o.s]+o.f+12-ottWrite(bar,n.start),ks,o.enh).absStep); }catch(e){} });
  return out; }
function nearHead(sec,bar,n,stp){ return noteSteps(sec,bar,n).some(v=>Math.abs(v-stp)<=1); }
/* 五線譜で押した所の相手を決める。
   音符の頭のすぐそば（左右に符頭ひとつ分）なら、その音符を相手にする（head）。
   長い音符の途中なら、吸い寄せずに押したマスへ置く（inTick：その音符より後ろのマスの頭）。 */
function staffTarget(sec,bar,head,x,rawT){
  const L=melLayout(sec,head);
  const hn=bar.notes.find(n=>n.kind!=='rest'&&Math.abs(x-(L.noteX(n.start)+MEL_SP*0.6))<=MEL_SP*1.1);
  if(hn) return {head:hn};
  const inside=bar.notes.find(n=>n.kind!=='rest'&&n.start<rawT&&rawT<n.start+n.len);
  if(!inside) return {};
  const E=cellEdges(sec,bar).filter(u=>u>inside.start&&u<inside.start+inside.len);
  if(!E.length) return {};
  let t=E[0]; E.forEach(u=>{ if(u<=rawT) t=u; });
  return {inTick:t};
}
function coverNote(bar,t){ return bar.notes.find(n=>n.kind!=='rest'&&n.start<=t&&t<n.start+n.len); }
function yOnMel(el,clientY){ const r=el.getBoundingClientRect(), G=melGeom(song().view,el); return G.top+(clientY-r.top)/r.height*G.h; }
function strAtY(sec,y){ const {LS,bot}=tabG(sec); return Math.max(0,Math.min(5,Math.round((bot-y)/LS))); }
function stepAtY(y){ const G=melGeom('staff'); return Math.round(34-(y-G.midY)/(MEL_SP/2)); }
/* 掴んでいる間、落ちる先の高さと位置を大きく出す */
function grabTip(ev,sec,bar,n){
  const o=(n.stops||[]).find(x=>typeof x.f==='number');
  const beat=Math.floor(n.start/beatTicksOf(sec))+1;
  const where=`${gIndex(sec,sec.bars.indexOf(bar))+1}小節目 ${beat}拍目`;
  if(!o) return fretTip(ev.clientX,ev.clientY,where);
  const m=midiOf(o);
  fretTip(ev.clientX,ev.clientY,`${PITCH_NM[m%12]}${Math.floor(m/12)-1}（${6-o.s}弦 ${o.f}）　${where}`);
}
function fretTip(x,y,txt){
  let t=document.getElementById('ftip');
  if(txt==null){ if(t) t.remove(); return; }
  if(!t){ t=document.createElement('div'); t.id='ftip'; t.className='ftip'; document.body.appendChild(t); }
  t.textContent=txt; t.style.left=Math.round(x)+'px'; t.style.top=Math.round(y-54)+'px';
}
const PITCH_NM=['ド','ド♯','レ','レ♯','ミ','ファ','ファ♯','ソ','ソ♯','ラ','ラ♯','シ'];

function bindLenDrag(el){
  el.addEventListener('contextmenu',e=>{ e.preventDefault(); if(MI.mode==='input'&&!MI.multi) togglePen(); });
  el.addEventListener('pointerdown',e=>{
    if(MI.tab!=='melody'&&!MI.multi){ /* コードの入力中でも、譜面を触ればメロディへ */ }
    if(e.pointerType==='touch'){
      TOUCHES.add(e.pointerId);
      if(TOUCHES.size===2){                     /* 二本指タップ：筆の持ち替え */
        if(GD) GD.abort();
        if(MI.mode==='input'&&!MI.multi) togglePen();
        return;
      }
    }else if(e.button!==0) return;
    const s=song(), sec=section(), bi=+el.dataset.bi, bar=sec.bars[bi], head=headOf(sec,bi);
    const raw=tickAtX(sec,bar,head,el,e.clientX);
    let tick=snapToCell(sec,bar,raw);
    let hit=coverNote(bar,raw)||coverNote(bar,tick);
    if(e.cancelable) e.preventDefault();
    const sel=window.getSelection&&window.getSelection(); if(sel&&sel.removeAllRanges) sel.removeAllRanges();
    const y0=yOnMel(el,e.clientY);
    /* 五線譜の〈入力〉では、符頭の高さを押した時だけその音符を相手にする（違う高さなら新しく入れる） */
    if(s.view!=='tab'&&!(MI.mode==='select'||MI.multi)){
      const r0=el.getBoundingClientRect(), x0=(e.clientX-r0.left)/r0.width*MEL_W, tg=staffTarget(sec,bar,head,x0,raw);
      if(tg.head){ hit=nearHead(sec,bar,tg.head,stepAtY(y0))?tg.head:null; tick=tg.head.start; }
      else { hit=null; if(tg.inTick!=null) tick=tg.inTick; } }
    const d={x0:e.clientX,y0:e.clientY,yIn:y0,bi,barId:bar.id,head,tick,noteId:hit?hit.id:null,
             axis:null,on:false,spilled:0,fresh:false,move:false,lp:null,ring:false};
    const selecting=MI.mode==='select'||MI.multi;
    if(hit){
      d.lp=setTimeout(()=>{
        d.lp=null;
        const grab=selecting||(s.view!=='tab'&&MI.pen!=='rest');   /* 五線譜は長押しで掴む（TABは奏法の輪） */
        if(grab){
          d.move=true; d.on=true; d.st0=hit.start; MI.dragging=true;
          document.querySelectorAll('.mel').forEach(x=>x.classList.add('grab'));
          MI.cur={barId:bar.id,tick:hit.start,s:(hit.stops[0]||{}).s!=null?hit.stops[0].s:null};
          navigator.vibrate&&navigator.vibrate(15);
          toast(s.view==='tab'?'動かす：横は置き場所、縦は弦':'動かす：横は置き場所、縦は音の高さ');
          renderBars(); renderMelDock();
        }else if(MI.pen!=='rest'){                /* 〈入力〉：長押しで奏法の輪 */
          d.ring=true; MI.noClick=Date.now(); cleanup();
          let str=null;
          if(s.view==='tab'){ const st=strAtY(sec,y0); if((hit.stops||[]).some(o=>o.s===st)) str=st; }
          if(str==null&&hit.stops&&hit.stops.length) str=hit.stops[hit.stops.length-1].s;
          MI.cur={barId:bar.id,tick:hit.start,s:str}; setTab('melody'); renderBars(); renderMelDock();
          openNoteRing(bi,hit.id,str,e.clientX,e.clientY,true);
        }
      },LP_MS);
    }
    const elOf=()=>document.querySelector(`.bar[data-sec="${S.secId}"] .mel[data-bi="${d.bi}"]`);
    const ctx=()=>{ const sec2=section(); if(!sec2) return null; const bar2=sec2.bars[d.bi];
      if(!bar2||bar2.id!==d.barId) return null; const n=bar2.notes.find(x=>x.id===d.noteId);
      const el2=elOf(); return (n&&el2)?{sec:sec2,bar:bar2,n,idx:bar2.notes.indexOf(n),el:el2}:null; };

    /* ── 縦：フレット（五線譜では半音）── */
    const vBegin=()=>{
      const sec2=section(), bar2=sec2.bars[d.bi]; let n=d.noteId?bar2.notes.find(x=>x.id===d.noteId):null;
      if(s.view==='tab'){
        d.str=strAtY(sec2,d.yIn);
        const o=n&&(n.stops||[]).find(x=>x.s===d.str);
        d.base=(o&&typeof o.f==='number')?o.f:(MI.lastFret||0);
      }else{
        const o=n&&(n.stops||[]).find(x=>typeof x.f==='number');
        if(o){ d.baseMidi=midiOf(o); d.near=o.f; }
        else{ const stp=stepAtY(d.yIn); if(stp<22||stp>50) return false;
          d.baseMidi=stepToMidi(stp,keySigOf(sec2),MI.acc)+ottWrite(bar2,d.tick); d.near=lastFretBefore(bar2,d.tick); }
      }
      if(!n){                                    /* 音符の無い所：まず音符を置く */
        MI.cur={barId:bar2.id,tick:d.tick,s:null};
        const at=d.tick, len=Math.min(curLen(),barTicksOf(sec2)-at);
        bar2.notes=bar2.notes.filter(m=>!(m.start>=at&&m.start<at+len));
        bar2.notes.forEach(m=>{ if(m.start<at&&m.start+m.len>at) m.len=at-m.start; });
        n={id:nid(),start:at,len,kind:'note',stops:[],sym:{},lyric:null};
        bar2.notes.push(n); bar2.notes.sort((a,b)=>a.start-b.start);
        d.noteId=n.id; d.fresh=true;
      }else if(n.kind==='rest'){ n.kind='note'; n.stops=[]; }
      d.keepT=null;
      if(s.view==='tab'){ const o=(n.stops||[]).find(x=>x.s===d.str); d.keepT=o&&o.t?o.t:{}; }
      else { const o=(n.stops||[])[0]; d.keepT=o&&o.t?o.t:{}; }
      return true;
    };
    const vMove=(ev,dy)=>{
      const c=ctx(); if(!c) return;
      const n=c.n; let txt, snd=null;
      if(s.view==='tab'){
        const rawF=d.base+Math.round(-dy/FRET_PX);
        const f=rawF<=-DEL_MARGIN?null:Math.max(0,Math.min(MAX_FRET,rawF));
        if(f===d.cur&&d.drew) { fretTip(ev.clientX,ev.clientY,d.tipTxt); return; }
        d.cur=f; d.drew=true;
        n.stops=(n.stops||[]).filter(o=>o.s!==d.str);
        if(f!=null){ n.stops.push({s:d.str,f,t:d.keepT||{}}); n.stops.sort((a,b)=>a.s-b.s); snd={s:d.str,f}; }
        txt=f==null?'消す':`${6-d.str}弦 ${f}`;
      }else{
        const m=d.baseMidi+Math.round(-dy/FRET_PX), lo=OPEN[0], hi=OPEN[5]+MAX_FRET;
        const mm=m<=lo-DEL_MARGIN?null:Math.max(lo,Math.min(hi,m));
        if(mm===d.cur&&d.drew){ fretTip(ev.clientX,ev.clientY,d.tipTxt); return; }
        d.cur=mm; d.drew=true;
        if(mm==null){ n.stops=[]; txt='消す'; }
        else{ const pos=fretFor(mm,d.near); if(!pos) return;
          n.stops=[{s:pos.s,f:pos.f,t:d.keepT||{}}]; snd=pos;
          txt=`${PITCH_NM[mm%12]}${Math.floor(mm/12)-1}（${6-pos.s}弦 ${pos.f}）`; }
      }
      d.tipTxt=txt; fretTip(ev.clientX,ev.clientY,txt);
      if(snd) preview(snd);
      renderBars();
    };
    const vEnd=()=>{
      fretTip(0,0,null);
      const sec2=section(), bar2=sec2&&sec2.bars[d.bi]; if(!bar2) return;
      const n=bar2.notes.find(x=>x.id===d.noteId); if(!n) return;
      if(!n.stops||!n.stops.length){             /* 押さえが残らなければ休符へ */
        n.kind='rest'; n.stops=[]; n.sym={}; delete n.accent; delete n.staccato; delete n.stroke;
        MI.cur={barId:bar2.id,tick:n.start,s:null};
      }else{
        const o=s.view==='tab'?n.stops.find(x=>x.s===d.str):n.stops[0];
        if(o&&typeof o.f==='number') MI.lastFret=o.f;
        MI.stamp=null;                           /* なぞって決めた数字は、数字そのもの。写しは手放す */
        MI.lastPut={barId:bar2.id,tick:n.start};
        MI.cur={barId:bar2.id,tick:n.start,s:o?o.s:null};
      }
      tidyBar(sec2,bar2);
    };

    const move=ev=>{
      const dx=ev.clientX-d.x0, dy=ev.clientY-d.y0;
      if(d.lp&&(Math.abs(dx)>14||Math.abs(dy)>14)){ clearTimeout(d.lp); d.lp=null; }
      if(d.move){                                 /* 長押しで掴んだ音符を動かす */
        const sec2=section(), bar2=sec2&&sec2.bars[d.bi], el2=elOf();
        const n=bar2&&bar2.notes.find(x=>x.id===d.noteId); if(!n||!el2) return;
        const raw=tickAtX(sec2,bar2,d.head,el2,ev.clientX);
        let changed=false;
        if(reorderNoteTo(sec2,bar2,n,Math.max(0,Math.min(barTicksOf(sec2)-1,raw)))) changed=true;
        const G=melGeom(song().view,el2), r2=el2.getBoundingClientRect();
        /* 縦：TABは弦ひとつずつ、五線譜は半音ずつ（なぞる時と同じ 9px で半音） */
        const tabV=song().view==='tab';
        const steps=tabV?Math.round(-dy/(r2.height/G.h*tabG(sec2).LS)):Math.round(-dy/FRET_PX);
        if(steps!==(d.lastStep||0)){
          const dd=steps-(d.lastStep||0); d.lastStep=steps;
          if(tabV) shiftNotePitch(sec2,bar2,n,dd,0); else shiftNoteSemi(n,dd);
          changed=true;
        }
        if(changed){ MI.cur={barId:bar2.id,tick:n.start,s:(n.stops[0]||{}).s!=null?n.stops[0].s:null}; renderBars(); }
        grabTip(ev,sec2,bar2,n);
        return;
      }
      if(!d.axis){
        if(Math.abs(dy)>=8&&Math.abs(dy)>Math.abs(dx)) d.axis='v';
        else if(Math.abs(dx)>=10&&Math.abs(dx)>=Math.abs(dy)) d.axis='h';
        else return;
        if(d.lp){ clearTimeout(d.lp); d.lp=null; }
        if(MI.multi){                              /* 〈選択〉：横になぞった範囲を選ぶ */
          if(d.axis!=='h'){ d.axis='none'; return; }
          d.axis='pick'; d.on=true; d.pick0=new Set(MI.picked);
        }
        if(d.axis==='v'){
          if(MI.mode!=='input'||MI.pen==='rest'){ d.axis='none'; return; }
          if(!vBegin()){ d.axis='none'; return; }
          d.on=true; MI.dragging=true; document.querySelectorAll('.mel').forEach(x=>x.classList.add('grab'));
          setTab('melody');
        }else{
          d.on=true; MI.dragging=true; document.querySelectorAll('.mel').forEach(x=>x.classList.add('grab'));
          if(MI.pen==='rest'&&MI.mode==='input'){ d.rest=true; d.st0=d.tick; }
          if(!d.rest&&!d.noteId){                 /* 何も無い所から：まず音符を置く */
            const made=makeNoteAt(sec,bar,d.bi,d.tick,el,d.y0,d.head);
            if(!made){ done(); return; }
            d.noteId=made.id; d.fresh=true; renderBars();
          }
          if(!d.rest){
            const c0=ctx(); if(!c0){ done(); return; }
            d.head0=c0.n.start; d.end0=c0.n.start+c0.n.len;
            MI.cur={barId:d.barId,tick:c0.n.start,s:(c0.n.stops[0]||{}).s!=null?c0.n.stops[0].s:null};
          }
        }
      }
      if(d.axis==='none') return;
      if(ev.cancelable) ev.preventDefault();
      if(d.axis==='pick'){
        const e2=document.elementFromPoint(ev.clientX,ev.clientY), m2=e2&&e2.closest&&e2.closest('.mel'); if(!m2) return;
        const sec2=secOfEl(m2); if(sec2!==section()) return;
        const bi2=+m2.dataset.bi, b2=sec2.bars[bi2]; if(!b2) return;
        const t2=tickAtX(sec2,b2,headOf(sec2,bi2),m2,ev.clientX);
        const A=[d.bi,d.tick], Bp=[bi2,t2], lo=(A[0]<Bp[0]||A[0]===Bp[0]&&A[1]<=Bp[1])?A:Bp, hi=lo===A?Bp:A;
        MI.picked=new Set(d.pick0);
        sec2.bars.forEach((bb,i)=>bb.notes.forEach(n=>{ if(n.kind==='rest') return;
          const aft=i>lo[0]||i===lo[0]&&n.start+n.len>lo[1], bef=i<hi[0]||i===hi[0]&&n.start<=hi[1];
          if(aft&&bef) MI.picked.add(n.id); }));
        renderBars(); renderMelDock(); return;
      }
      if(d.axis==='v'){ vMove(ev,dy); return; }
      if(d.rest){                                 /* 休符の筆：なぞった範囲を休符にする */
        const sec2=section(), bar2=sec2&&sec2.bars[d.bi], el2=elOf(); if(!bar2||!el2) return;
        const total2=barTicksOf(sec2), t2=tickAtX(sec2,bar2,d.head,el2,ev.clientX);
        const g2=snapTicksAt(sec2,bar2,Math.max(0,Math.min(total2-1,t2)));
        const a=Math.min(d.st0,Math.round(t2/g2)*g2), b2=Math.max(d.st0+g2,Math.round(t2/g2)*g2);
        const st=Math.max(0,a), en=Math.min(total2,b2);
        if(d.rst!==st||d.ren!==en){ d.rst=st; d.ren=en; if(!d.base) d.base=JSON.stringify(bar2.notes);
          bar2.notes=JSON.parse(d.base); makeRestOver(sec2,bar2,st,en-st); renderBars(); }
        return;
      }
      const c=ctx(); if(!c) return;
      const total2=barTicksOf(c.sec), t2=tickAtX(c.sec,c.bar,d.head,c.el,ev.clientX);
      const g2=snapTicksAt(c.sec,c.bar,Math.max(0,Math.min(total2-1,t2)));
      if(!d.fresh&&d.head0>0&&t2<d.head0-g2*0.5){       /* 頭を前へ伸ばす */
        const st=Math.max(0,Math.min(d.head0-g2,Math.round(t2/g2)*g2));
        if(st!==c.n.start){ moveNoteHead(c.sec,c.bar,c.idx,st); renderBars(); }
        return;
      }
      if(c.n.start<d.head0){ c.n.start=d.head0; c.n.len=d.end0-d.head0; }
      let want=Math.round((t2-c.n.start)/g2)*g2;
      const room=total2-c.n.start;
      const r=c.el.getBoundingClientRect(), crossed=ev.clientX>r.right-2;
      if(crossed&&want>room&&!d.spilled){
        const over=Math.max(g2,Math.round((want-room)/g2)*g2);
        if(setLenAcross(c.sec,d.bi,c.idx,room+over)>0){ d.spilled=over; renderBars(); return; }
      }
      if(d.spilled) return;
      const len=Math.max(g2,Math.min(room,want));
      if(len!==c.n.len){ setNoteLen(c.sec,c.bar,c.idx,len); renderBars(); }
    };
    const cleanup=()=>{
      fretTip(0,0,null);
      if(d.lp){ clearTimeout(d.lp); d.lp=null; }
      MI.dragging=false; document.querySelectorAll('.mel').forEach(x=>x.classList.remove('grab'));
      window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',done);
      window.removeEventListener('pointercancel',cancel);

    const done=ev=>{
      if(ev&&ev.pointerId!=null) TOUCHES.delete(ev.pointerId);
      cleanup();
      if(d.ring) return;
      if(d.axis==='v'){ vEnd(); touch(song()); renderBars(); renderMelDock(); MI.noClick=Date.now(); return; }
      if(d.axis==='pick'){ renderBars(); renderMelDock(); MI.noClick=Date.now(); return; }
      if(d.on||d.move){ touch(song()); renderBars(); renderMelDock(); MI.noClick=Date.now(); return; }
      if(d.axis==='none'){ MI.noClick=Date.now(); return; }
      MI.noClick=Date.now(); const el2=elOf(); if(el2){ melTap(el2,d.x0,d.y0); followCursorLine(); }
    };
    const cancel=ev=>{ if(ev&&ev.pointerId!=null) TOUCHES.delete(ev.pointerId); fretTip(0,0,null);
      cleanup(); if(d.on||d.move){ if(d.axis==='v') vEnd(); touch(song()); renderBars(); renderMelDock(); } MI.noClick=Date.now(); };
    d.abort=()=>{ fretTip(0,0,null); cleanup(); if(d.on){ if(d.axis==='v') vEnd(); touch(song()); renderBars(); renderMelDock(); } MI.noClick=Date.now(); };
    if(GD) GD.abort();
    GD=d;
    window.addEventListener('pointermove',move,{passive:false}); window.addEventListener('pointerup',done);
    window.addEventListener('pointercancel',cancel);

}

/* なぞった範囲を、ひとつの休符にする（ScoreLineTAB と同じ扱い）
   前に掛かる音符はその手前で切り、範囲の中は消し、後ろへ抜ける分は範囲の終わりから残す。
   休符に繋がりは無いので、残した音符からはタイと繋がりを落とす。 */
function makeRestOver(sec,bar,st,len){
  const total=barTicksOf(sec);
  st=Math.max(0,Math.min(total-1,Math.round(st)));
  len=Math.max(1,Math.min(total-st,Math.round(len)));
  const en=st+len, keep=[], tails=[];
  (bar.notes||[]).forEach(n=>{
    if(!n||n.len<=0) return;
    const a0=n.start, a1=n.start+n.len;
    if(a1<=st||a0>=en){ keep.push(n); return; }
    if(a0<st){ n.len=st-a0; (n.stops||[]).forEach(o=>{ if(o.t&&o.t.link==='tie') delete o.t.link; }); keep.push(n); }
    if(a1>en) tails.push({id:nid(),start:en,len:a1-en,kind:n.kind,
      stops:n.kind==='rest'?[]:(n.stops||[]).map(o=>({s:o.s,f:o.f,t:Object.assign({},o.t||{},{link:null})})),
      sym:Object.assign({},n.sym||{}),lyric:null});
  });
  bar.notes=keep.concat([{id:nid(),start:st,len,kind:'rest',stops:[],sym:{},lyric:null}],tails)
    .sort((a,b)=>a.start-b.start);
  tidyBar(sec,bar);
}
/* なぞり始めの位置に音符を作る（五線譜は高さ、TABは弦と前に使ったフレット） */
function makeNoteAt(sec,bar,bi,tick,el,clientY,head){
  const s=song(), r=el.getBoundingClientRect(), G=melGeom(s.view,el);
  const y=G.top+(clientY-r.top)/r.height*G.h;
  let stop=null;
  if(s.view==='tab'){
    const SP=MEL_SP, LS=1.30*SP, bot=1.6*SP+5*LS;
    const st=Math.max(0,Math.min(5,Math.round((bot-y)/LS)));
    stop={s:st,f:MI.lastFret||0};
  }else{
    const stp=Math.round(34-(y-G.midY)/(MEL_SP/2));
    if(stp<22||stp>50) return null;
    const pos=fretFor(stepToMidi(stp,keySigOf(sec),MI.acc)+ottWrite(bar,tick),lastFretBefore(bar,tick));
    if(!pos) return null;
    stop={s:pos.s,f:pos.f};
  }
  bar.notes.forEach(n=>{ if(n.start<tick&&n.start+n.len>tick) n.len=tick-n.start; });   /* 前から伸びている音は、先に手前で区切る */
  clearSpan(bar,tick,tick+snapTicks(),null);
  const n={id:nid(),start:tick,len:snapTicks(),kind:'note',stops:[Object.assign({t:{}},stop)],sym:{},lyric:null};
  bar.notes.push(n); bar.notes.sort((a,b)=>a.start-b.start);
  preview(stop);
  return n;
}

/* 押した（なぞらなかった）ときは、位置と弦を選ぶだけ */
function melTap(el,cx,cy){
    if(OTTSEL){ OTTSEL=null; renderBars(); return; }
    const s=song(), sec=section(); if(!sec) return;
    const bi=+el.dataset.bi, bar=sec.bars[bi]; if(!bar) return;
    const head=headOf(sec,bi);
    const r=el.getBoundingClientRect(); if(!r.width) return;
    const fx=(cx-r.left)/r.width, fy=(cy-r.top)/r.height;
    const L=melLayout(sec,head), total=barTicksOf(sec);
    const x=fx*MEL_W;
    const rawT=(x-L.padL-L.HEAD_OFF)/L.innerW*total;
    let tick=snapToCell(sec,bar,rawT);
    let hit=x>L.padL?(coverNote(bar,rawT)||bar.notes.find(n=>n.start===tick)):null;
    if(s.view!=='tab'&&!MI.multi&&x>L.padL){                  /* 五線譜：頭のそばだけ音符を相手に、途中なら押したマスへ */
      const tg=staffTarget(sec,bar,head,x,rawT);
      if(tg.head){ hit=tg.head; tick=tg.head.start; }
      else if(tg.inTick!=null){ hit=null; tick=tg.inTick; }
      else if(hit&&hit.kind!=='rest'){ hit=null; } }
    if(MI.multi){ if(hit){ MI.picked.has(hit.id)?MI.picked.delete(hit.id):MI.picked.add(hit.id); } MI.cur={barId:bar.id,tick,s:null}; setTab('melody'); renderBars(); return; }
    const G=melGeom(s.view,el), y=G.top+fy*G.h;
    MI.cur={barId:bar.id,tick,s:null}; setTab('melody');
    if(s.view==='tab'){
      const {LS,bot}=tabG(sec), st=Math.round((bot-y)/LS);
      MI.cur.s=Math.max(0,Math.min(5,st));
    }else if(hit&&hit.kind!=='rest'){
      const o=(hit.stops||[])[0]; if(o&&o.s!=null) MI.cur.s=o.s;
    }
    if(MI.mode!=='input'){ renderBars(); renderMelDock(); return; }   /* 〈選ぶ〉は位置を選ぶだけ */
    if(MI.pen==='rest'){ putNote(null,true); return; }                    /* 休符の筆：押した所に休符 */
    const stp0=s.view!=='tab'?Math.round(34-(y-G.midY)/(MEL_SP/2)):null;
    if(hit&&hit.kind!=='nope'&&hit.kind!=='rest'){
      if(s.view!=='tab'){
        if(nearHead(sec,bar,hit,stp0)){                                /* 五線譜：符頭の高さを押した時だけ、その音を選んで鳴らす（長押しで掴める） */
          const o=(hit.stops||[]).find(x=>typeof x.f==='number'); if(o) preview(o);
          renderBars(); renderMelDock(); return;
        }
        /* 違う高さを押した：音符の頭なら高さを書き換え、途中ならそこで区切って置く */
        if(stp0<22||stp0>50){ renderBars(); renderMelDock(); return; }
        const midi2=stepToMidi(stp0,keySigOf(sec),MI.acc)+ottWrite(bar,tick); MI.acc=null;
        const pos2=fretFor(midi2,lastFretBefore(bar,tick));
        if(!pos2){ toast('ギターで出せない高さです'); renderBars(); renderMelDock(); return; }
        if(tick===hit.start){
          const t0=((hit.stops||[])[0]||{}).t||{};
          hit.stops=[{s:pos2.s,f:pos2.f,t:t0}]; MI.cur={barId:bar.id,tick:hit.start,s:pos2.s}; MI.lastFret=pos2.f;
          touch(s); preview(pos2); renderBars(); renderMelDock(); return;
        }
        stampNote({s:pos2.s,f:pos2.f}); return;
      }
      { const o=(hit.stops||[]).find(x=>x.s===MI.cur.s&&typeof x.f==='number')||(hit.stops||[]).find(x=>typeof x.f==='number');   /* TAB：その音を選んで鳴らす */
        if(o){ MI.lastFret=o.f; preview(o); } }
      renderBars(); renderMelDock(); return;
    }
    if(s.view==='tab'){
      const f=MI.lastFret||0;
      stampNote({s:MI.cur.s,f}); return;
    }
    const stp=Math.round(34-(y-G.midY)/(MEL_SP/2));
    if(stp<22||stp>50){ renderBars(); renderMelDock(); return; }
    const midi=stepToMidi(stp,keySigOf(sec),MI.acc)+ottWrite(bar,tick); MI.acc=null;
    const pos=fretFor(midi,lastFretBefore(bar,tick));
    if(!pos){ toast('ギターで出せない高さです'); renderBars(); renderMelDock(); return; }
    stampNote({s:pos.s,f:pos.f});
}
/* ── 写し：置いた音（数字・奏法・長さ）を控えて、次に置く音に使う ──
   タイと繋がりは前後の間の出来事なので写さない。記号と歌詞も写さない。 */
const STAMP_DROP={link:1,tie:1,grace:1};
function takeStamp(n){
  const o=(n.stops||[]).find(x=>typeof x.f==='number')||n.stops[0]; if(!o) return;
  const t={}; Object.keys(o.t||{}).forEach(k=>{ if(!STAMP_DROP[k]) t[k]=JSON.parse(JSON.stringify(o.t[k])); });
  MI.stamp={f:o.f,len:n.len,t,accent:!!n.accent,staccato:!!n.staccato,stroke:n.stroke||null,
    sym:['ring','arp','rake','trem','arm','pm','pmKind'].reduce((a,k)=>{ if(n.sym&&n.sym[k]) a[k]=n.sym[k]; return a; },{})};
  if(typeof o.f==='number') MI.lastFret=o.f;
  MI.cur={barId:MI.cur?MI.cur.barId:null,tick:n.start,s:o.s};
  toast('この音を写しました（数字・奏法・長さ）');
}
function stampNote(stop,noLen){
  MI.stamp=null;                                     /* 写しは外した（置く音は押した所のまま） */
  const st=MI.stamp;
  putNote(stop,false);
  if(st&&MI.stampMode==='full'&&st.len>0&&!noLen){       /* 写しの長さを、置いたばかりの音符へ当てる */
    const sec=section(), bar=sec&&sec.bars.find(b=>b.id===MI.putBarId);
    const i=bar?bar.notes.findIndex(x=>x.start===MI.putTick):-1;
    if(i>=0) setNoteLen(sec,bar,i,st.len);
  }
  applyStampTo(stop,true);
  if(typeof stop.f==='number') MI.lastFret=stop.f;
}
/* 写しの奏法を、置いたばかりの音符へ重ねる。
   すでに付いている印は残す。accent などは、写しが持っている時だけ付ける。
   長さは〈数字・奏法・長さ〉のときだけ（置く側で先に当てている）。 */
function applyStampTo(stop,noLen){
  const st=MI.stamp, sec=section();
  if(!st||MI.stampMode==='num'||!sec) return;
  const bar=sec.bars.find(b=>b.id===MI.putBarId); if(!bar) return;
  const n=bar.notes.find(x=>x.start===MI.putTick); if(!n||n.kind==='rest') return;
  const o=(n.stops||[]).find(y=>y.s===stop.s); if(!o) return;
  o.t=Object.assign({},o.t||{},JSON.parse(JSON.stringify(st.t||{})));
  if(st.accent) n.accent=true;
  if(st.staccato) n.staccato=true;
  if(st.stroke) n.stroke=st.stroke;
  if(st.sym&&Object.keys(st.sym).length) n.sym=Object.assign({},n.sym||{},JSON.parse(JSON.stringify(st.sym)));
  if(!noLen&&MI.stampMode==='full'&&st.len>0) setNoteLen(sec,bar,bar.notes.indexOf(n),st.len);
  touch(song()); renderBars();
}
function stampCount(){
  if(!MI.stamp) return 0;
  let k=Object.keys(MI.stamp.t||{}).length;
  if(MI.stamp.accent) k++; if(MI.stamp.staccato) k++; if(MI.stamp.stroke) k++;
  return k+Object.keys(MI.stamp.sym||{}).length;
}
function stampBrief(){
  if(!MI.stamp||MI.stampMode==='num') return '';
  const k=stampCount(), ln=MI.stampMode==='full'?lenName(MI.stamp.len):null, bits=[];
  if(k) bits.push('奏法'+k); if(ln) bits.push(ln);
  return bits.length?('・'+bits.join('・')):'';
}

function pickWhole(all){

function joinPicked(on){
  const sec=section(), L=pickedNotesInOrder(); let k=0;
  L.forEach(({bi,n})=>{
    const nx=neighborNote(sec,bi,n,1); if(!nx||!MI.picked.has(nx.n.id)&&on) return;
    (n.stops||[]).forEach(a=>{ const b=stopOn(nx.n,a.s); if(!b||typeof a.f!=='number') return;
      b.t=b.t||{};
      if(on){ b.t.link=b.f===a.f?'tie':(b.f>a.f?'h':'p'); k++; }
      else if(['tie','h','p','sl','leg'].includes(b.t.link)){ delete b.t.link; k++; } });
  });
  if(!on) L.forEach(({n})=>(n.stops||[]).forEach(o=>{ if(o.t&&['tie','h','p','sl','leg'].includes(o.t.link)){ delete o.t.link; k++; } }));
  if(!k) return toast(on?'つなげる相手がありません。続いた音を二つ以上選んでください':'外すつなぎがありません');

/* 定型：均した刻みを小節へ当てる（ScoreLineTAB の〈定型〉と同じ八つ）。
   音の高さは、その時刻に鳴っていた音を引き継ぐ */
const RHYTHMS=[['全音符','whole'],['2分','half'],['4分','4down'],['8分','8down'],['付点8分','dot8'],['16分','16alt'],['シャッフル','shuffle'],['3連','triplet']];
function rhythmTargets(){
  const sec=section(); if(!sec) return [];
  if(MI.multi&&MI.picked.size) return sec.bars.filter(b=>b.notes.some(n=>MI.picked.has(n.id)));
  const c=curBar(); return c?[c.bar]:[sec.bars[0]];
}
function applyRhythmBar(sec,bar,key){
  const total=barTicksOf(sec), ts=tsObj(sec.ts), beat=Math.round(4/ts.d*TPQ), nB=Math.max(1,Math.round(total/beat));
  const olds=bar.notes.filter(n=>n.kind!=='rest'&&n.stops&&n.stops.length).sort((a,b)=>a.start-b.start);
  const fallback=[{s:MI.cur&&MI.cur.s!=null?MI.cur.s:1,f:MI.lastFret||0,t:{}}];
  const stopsAt=t=>{ let p=null; for(const o of olds){ if(o.start<=t) p=o; } p=p||olds[0];
    return p?p.stops.map(o=>({s:o.s,f:o.f,t:{}})):JSON.parse(JSON.stringify(fallback)); };
  const out=[], push=(st,len,stroke)=>{ st=Math.round(st); len=Math.round(len);
    if(len>0&&st<total) out.push({id:nid(),start:st,len:Math.min(len,total-st),kind:'note',stops:stopsAt(st),sym:{},lyric:null}); };
  if(key==='whole') push(0,total);
  else if(key==='half'){ for(let b=0;b<nB;b+=2) push(b*beat,Math.min(beat*2,total-b*beat)); }
  else for(let b=0;b<nB;b++){ const o=b*beat;
    if(key==='4down') push(o,beat);
    else if(key==='8down'){ push(o,beat/2); push(o+beat/2,beat/2); }
    else if(key==='dot8'){ push(o,beat*3/4); push(o+beat*3/4,beat/4); }
    else if(key==='16alt'){ for(let k=0;k<4;k++) push(o+k*beat/4,beat/4); }
    else if(key==='shuffle'){ push(o,beat*2/3); push(o+beat*2/3,beat/3); }
    else if(key==='triplet'){ for(let k=0;k<3;k++) push(o+k*beat/3,beat/3); } }
  bar.notes=out; tidyBar(sec,bar);
}
function openRhythmSheet(){
  const tg=rhythmTargets(); if(!tg.length) return toast('小節がありません');
  const rows=[RHYTHMS.slice(0,3),RHYTHMS.slice(3,6),RHYTHMS.slice(6,8)], lb=['ゆったり','8分','細かい'];

/* ── 数字の打ち方（ScoreLineTAB と同じ）──
   送り 切：同じマスに留まり、0.8秒以内の連打で二桁になる。
   送り 入：一打で置いて次のマスへ。0.35秒以内の次の一打は、前のマスへ連結して二桁にする。 */
function typeFret(dig){
  if(!curBar()) return toast('先に譜面を押して、入れる位置を選んでください');
  if(MI.cur.s==null) MI.cur.s=2;
  if(dig==='x'){ MI.stamp=null; MI.fb=''; MI.fbCell=null; putNote({s:MI.cur.s,f:'x'},false); return; }
  const t=Date.now();
  const put=f=>{ MI.stamp=null; MI.lastFret=f; putNote({s:MI.cur.s,f},false); };
  if(!MI.adv){
    MI.fb=((t-MI.fbT)<800)?(MI.fb+dig):String(dig); MI.fbT=t; MI.fbCell=null;
    let f=parseInt(MI.fb,10);
    if(!(f>=0&&f<=MAX_FRET)){ MI.fb=String(dig); f=parseInt(dig,10); }
    put(f); return;
  }
  const join=MI.fbCell&&(t-MI.fbT)<350&&MI.fb.length===1;
  MI.fbT=t;
  if(join){
    const two=parseInt(MI.fb+dig,10);
    if(two>=0&&two<=MAX_FRET){
      MI.fb=MI.fb+dig;
      const keep=Object.assign({},MI.cur);
      MI.cur=Object.assign({},MI.fbCell);          /* 前のマスへ戻して書き直す */
      put(two);
      MI.cur=keep; renderBars(); renderMelDock();
      return;
    }
  }
  MI.fb=String(dig); MI.fbCell=Object.assign({},MI.cur);
  put(parseInt(dig,10));
}

function histRecord(){

  HIST.undo.push(HIST.last); if(HIST.undo.length>HIST.max) HIST.undo.shift();
  HIST.redo.length=0; HIST.last=now;

function histGo(dir){
  const from=dir<0?HIST.undo:HIST.redo, to=dir<0?HIST.redo:HIST.undo;
  if(!from.length) return toast(dir<0?'これ以上戻せません':'やり直す操作がありません');

/* ════════ キーボード（ScoreLineTAB と同じ）════════
   〈入力〉 数字＝フレット／↑↓＝弦／←→＝時間／Tab・Enter＝次へ（⇧で前へ）
            T＝タイ／H＝ハンマリング／P＝プリング／S＝スライド（いま書いた音へ。もう一度で外れる）
            U＝チョークアップ／D＝チョークダウン（戻し）／⌥D・⌥U＝ピッキングの向き
            B＝チョーキング（輪）／V＝ビブラート／G＝グリス（輪）／M＝ミュート
            ⌥4・⌥8・⌥6・⌥3＝刻み（4分・8分・16分・3連）／Esc＝送りを切る
   どこでも ⌘C＝コピー／⌘X＝切り取り／⌘V＝貼り付け／⌘A＝ぜんぶ選ぶ／⌘Z・⇧⌘Z＝取り消し・やり直し */
function keyTarget(){                              /* 「いま書いた音」。無ければカーソルの音 */
  if(!song()) return null;
  const tryAt=(barId,tick)=>{ const sec=secOfBar(barId); if(!sec) return null; const bi=sec.bars.findIndex(b=>b.id===barId);
    const bar=sec.bars[bi], n=coverNote(bar,tick); return n?{sec,bi,bar,n}:null; };
  let r=MI.lastPut&&tryAt(MI.lastPut.barId,MI.lastPut.tick);
  if(!r&&MI.cur) r=tryAt(MI.cur.barId,MI.cur.tick);
  if(!r) return null;
  const st=r.n.stops||[];
  r.o=(MI.cur&&MI.cur.s!=null&&st.find(x=>x.s===MI.cur.s))||st[st.length-1]||null;
  return r;
}
function notePoint(bi,tick){                       /* 輪を出す位置（その音符の画面上の所） */
  const sec=section(), el=sec&&document.querySelector(`.bar[data-sec="${sec.id}"] .mel[data-bi="${bi}"]`);
  if(!el||!sec) return {x:innerWidth/2,y:innerHeight/2};
  const r=el.getBoundingClientRect(), L=melLayout(sec,headOf(sec,bi)), total=barTicksOf(sec);
  return {x:r.left+(L.padL+L.HEAD_OFF+tick/total*L.innerW)/MEL_W*r.width, y:r.top+r.height/2};
}
function keyLink(v){
  const k=keyTarget(); if(!k||!k.o||typeof k.o.f!=='number') return toast('先に音を置いてください');
  const t=k.o.t=k.o.t||{};
  if(t.link===v){ delete t.link; ringDone(); return; }
  const pv=neighborNote(k.sec,k.bi,k.n,-1), a=pv&&stopOn(pv.n,k.o.s);
  if(!pv||pv.n.kind==='rest') return toast('前に音符がありません');
  if(!a) return toast('前の音符に、同じ弦の押さえがありません');
  if(v==='tie'){ if(a.f!==k.o.f) return toast('タイは、前と同じフレットの時に掛けられます'); }
  else { const why=linkWhy(v,a,k.o); if(why) return toast(why); }
  t.link=v; ringDone();
}
function moveCursor(dir){
  const c=curBar(); if(!c) return;
  const total=barTicksOf(c.sec), g=snapTicksAt(c.sec,c.bar,MI.cur.tick);
  let t=MI.cur.tick+dir*g;
  if(t>=total){ const nx=flatAt(c.sec,c.bi,1); if(nx){ MI.cur={barId:nx.b.id,tick:0,s:MI.cur.s}; S.secId=nx.sec.id; } }
  else if(t<0){ const pv=flatAt(c.sec,c.bi,-1); if(pv){ const t2=barTicksOf(pv.sec), g2=snapTicksAt(pv.sec,pv.b,t2-1); MI.cur={barId:pv.b.id,tick:Math.floor((t2-1)/g2)*g2,s:MI.cur.s}; S.secId=pv.sec.id; } }
  else MI.cur.tick=snapToCell(c.sec,c.bar,t);
  MI.lastPut=null;
  followCursorLine();
  renderBars(); renderMelDock();
}
function followCursorLine(){
  if(playing||!MI.cur) return;
  const tl=curTimeline(); if(!tl) return;
  const b=tl.bars.find(x=>x.id===MI.cur.barId); if(!b) return;
  if(tl.bars[barAtPos(tl,playPos)]===b) return;    /* 線がもうその小節にあれば動かさない */
