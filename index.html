document.addEventListener('keydown',e=>{
  const tg=e.target, typing=tg&&(tg.tagName==='INPUT'||tg.tagName==='SELECT'||tg.tagName==='TEXTAREA'||tg.isContentEditable);
  if(typing) return;
  const mod=e.metaKey||e.ctrlKey, K=(e.key||'').toLowerCase(), C=e.code||'';
  if(mod&&K==='z'){ e.preventDefault(); histGo(e.shiftKey?1:-1); return; }
  if(OTTSEL&&S.view==='sec'&&!mod){
    if(e.key==='Escape'){ OTTSEL=null; renderBars(); return; }
    if(e.key==='Backspace'||e.key==='Delete'){ e.preventDefault(); ottClearGroup(OTTSEL); OTTSEL=null; touch(song()); renderBars(); return; }
  }
  /* 〈コード〉で選んでいるコードは、Delete（Backspace）でも消せる */
  if(S.view==='sec'&&MI.tab==='chord'&&!document.querySelector('.veil')&&!_rad
     &&(e.key==='Backspace'||e.key==='Delete')&&selSpot()){ e.preventDefault(); delChordSel(); return; }
  if(S.view!=='sec'||MI.tab!=='melody'||document.querySelector('.veil')||_rad) return;
  const sec=section(); if(!sec) return;
  if(mod&&K==='a'){ e.preventDefault(); MI.multi=true; MI.picked.clear(); pickWhole(true); renderDock(); return; }
  if(mod&&K==='c'){ e.preventDefault(); copyRange(); return; }
  if(mod&&K==='x'){ e.preventDefault(); copyRange(); deleteNotes(); return; }
  if(mod&&K==='v'){ e.preventDefault(); pasteClip(); return; }
  if(mod) return;
  if(e.key==='Escape'){
    if(MI.multi&&MI.picked.size){ MI.picked.clear(); renderBars(); renderMelDock(); return; }
    if(MI.adv){ MI.adv=false; toast('送りを切りました'); renderMelDock(); } return; }
  if(!MI.cur) MI.cur={barId:sec.bars[0].id,tick:0,s:2};
  if(e.key==='Backspace'||e.key==='Delete'){ e.preventDefault(); deleteNotes(); return; }
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ e.preventDefault(); moveCursor(e.key==='ArrowRight'?1:-1); return; }
  if(e.key==='Tab'||e.key==='Enter'){ e.preventDefault(); moveCursor(e.shiftKey?-1:1); return; }
  if(e.key==='ArrowUp'||e.key==='ArrowDown'){ e.preventDefault();
    MI.cur.s=Math.max(0,Math.min(5,(MI.cur.s==null?2:MI.cur.s)+(e.key==='ArrowUp'?1:-1))); renderBars(); renderMelDock(); return; }
  if(MI.multi) return;
  if(e.altKey){                                    /* ⌥：刻みとピッキング（Mac では ⌥ で字が化けるので code で見る） */
    const snapBy={Digit4:'q4',Digit8:'e8',Digit6:'s16',Digit3:'t8'};
    if(snapBy[C]){ e.preventDefault(); MI.snap=snapBy[C]; toast('刻みを'+SNAPS.find(x=>x[0]===MI.snap)[2]+'にしました'); renderBars(); renderMelDock(); return; }
    if(/^Digit[1257]$/.test(C)){ e.preventDefault(); toast('ScoreLineCompassの刻みは、4分・8分・16分・3連です'); return; }
    if(C==='KeyD'||C==='KeyU'){ e.preventDefault(); const k=keyTarget(); if(!k||k.n.kind==='rest') return toast('先に音を置いてください');
      const v=C==='KeyD'?'down':'up'; if(k.n.stroke===v) delete k.n.stroke; else k.n.stroke=v; ringDone(); return; }
    return;
  }
  if(/^[0-9]$/.test(e.key)){ e.preventDefault();
    if(MI.pen==='rest') return toast('いまは休符を置く筆です。右クリックか〈音符〉で持ち替えてください');
    MI.lastPut={barId:MI.cur.barId,tick:MI.cur.tick}; typeFret(e.key); return; }
  if(K==='x'){ e.preventDefault(); MI.lastPut={barId:MI.cur.barId,tick:MI.cur.tick}; typeFret('x'); return; }
  const need=()=>{ const k=keyTarget(); if(!k||!k.o){ toast('先に音を置いてください'); return null; } return k; };
  if(K==='t'){ e.preventDefault(); keyLink('tie'); return; }
  if(K==='h'){ e.preventDefault(); keyLink('h'); return; }
  if(K==='p'){ e.preventDefault(); keyLink('p'); return; }
  if(K==='s'){ e.preventDefault(); keyLink('sl'); return; }
  if(K==='u'){ e.preventDefault(); const k=need(); if(!k) return; const t=k.o.t=k.o.t||{};
    t.bend=Object.assign({amt:1},t.bend||{},{pre:!(t.bend&&t.bend.pre)}); ringDone(); return; }
  if(K==='d'){ e.preventDefault(); const k=need(); if(!k) return; const t=k.o.t=k.o.t||{};
    if(t.link==='bd'){ delete t.link; ringDone(); return; }
    const pv=neighborNote(k.sec,k.bi,k.n,-1), a=pv&&stopOn(pv.n,k.o.s);
    if(!(a&&a.t&&a.t.bend&&a.t.bend.amt>0)) return toast('チョークダウンは、前の音をチョーキングしている時に掛けられます');
    t.link='bd'; ringDone(); return; }
  if(K==='m'){ e.preventDefault(); const k=need(); if(!k) return; const t=k.o.t=k.o.t||{};
    if(t.mute) delete t.mute; else t.mute=true; ringDone(); return; }
  if(K==='v'){ e.preventDefault(); const k=need(); if(!k) return; const p=notePoint(k.bi,k.n.start); openVibRing(k.o,p.x,p.y); return; }
  if(K==='b'||K==='g'){ e.preventDefault(); const k=need(); if(!k) return;
    if(typeof k.o.f!=='number') return toast('×（ミュート音）には付けられません');
    const p=notePoint(k.bi,k.n.start);
    if(K==='b') openBendRing(k.sec,k.bi,k.n,k.o,p.x,p.y); else openGlissRing(k.o,p.x,p.y); return; }
});

/* ════════ 奏法の輪（ScoreLineTAB の輪をそのまま移したもの）════════
   長押しで出る。指を離さず滑らせて離しても、離してから叩いても選べる。
   区画へ出ずにその場で離せば、輪は開いたまま残る。中心は〈くわしく〉（奏法パネル）。 */
const RAD_IN=30;
let _rad=null, _radAt={x:0,y:0};
function radDims(n){
  if(n<=2) return {out:96, lbl:52, fs:16, sub:9};
  if(n>8)  return {out:132, lbl:92, fs:12.5, sub:7.5};
  if(n>6)  return {out:104, lbl:70, fs:14,   sub:8};
  return {out:88, lbl:60, fs:15, sub:8.5};
}
let _mctx=null, _mfont='';
const _mcache=new Map();
function measureText(t,size){
  const str=String(t), key=size+'\u0000'+str;
  const hit=_mcache.get(key); if(hit!==undefined) return hit;
  let w;
  try{ if(!_mctx){ _mctx=document.createElement('canvas').getContext('2d'); }
    const f='800 '+size+'px -apple-system,Helvetica Neue,Arial,sans-serif';
    if(f!==_mfont){ _mctx.font=f; _mfont=f; }
    w=_mctx.measureText(str).width;
  }catch(e){ w=str.length*size*0.62; }
  if(_mcache.size>4000) _mcache.clear();
  _mcache.set(key,w); return w;
}
function closeRadial(){
  if(!_rad) return;
  const r=_rad; _rad=null;
  document.body.classList.remove('radialing');
  document.removeEventListener('pointermove',r.onMove,true);
  document.removeEventListener('pointerup',r.onUp,true);
  document.removeEventListener('pointercancel',r.onUp,true);
  if(r.el&&r.el.parentNode) r.el.parentNode.removeChild(r.el);
}
function radSector(dx,dy,n){
  n=n||6;
  const dm=radDims(n), d=Math.sqrt(dx*dx+dy*dy);
  if(d<RAD_IN) return 'c';
  if(d>dm.out+34) return null;
  const step=360/n, half=(n===2)?0:step/2;
  let a=Math.atan2(dy,dx)*180/Math.PI;
  a=(a+90+360)%360;
  return Math.floor(((a+half)%360)/step)%n;
}
/* items … {t:大きな字, sub:小さな字, on:付いている, off:押せない理由, fn}。空けたい区画は null。
   center … {t,fn}。drag … 長押しの指がまだ触れている */
function openRadial(cx,cy,items,center,drag,opt){
  closeRadial();
  _radAt={x:cx,y:cy};
  const N=(items.length<=2)?2:((items.length>8)?12:((items.length>6)?8:6));
  const dm=radDims(N), step=360/N, half=(N===2)?0:step/2;
  const W=window.innerWidth, H=window.innerHeight, M=dm.out+18;
  cx=Math.max(M,Math.min(W-M,cx)); cy=Math.max(M,Math.min(H-M,cy));
  const el=document.createElement('div'); el.className='rad-ov';
  const S=(dm.out+16)*2;
  const pt=(r,a)=>[(S/2+r*Math.sin(a*Math.PI/180)).toFixed(2),(S/2-r*Math.cos(a*Math.PI/180)).toFixed(2)];
  let g=`<svg class="rad" width="${S}" height="${S}" viewBox="0 0 ${S} ${S}" style="left:${(cx-S/2).toFixed(1)}px;top:${(cy-S/2).toFixed(1)}px">`;
  g+=`<circle class="rad-bg" cx="${S/2}" cy="${S/2}" r="${dm.out}"/>`;
  for(let i=0;i<N;i++){
    const it=items[i];
    const a0=i*step-half, a1=i*step+half;
    const [x0,y0]=pt(RAD_IN,a0), [x1,y1]=pt(dm.out,a0), [x2,y2]=pt(dm.out,a1), [x3,y3]=pt(RAD_IN,a1);
    g+=`<path class="rad-s${(!it||it.off)?' off':''}${(it&&it.on)?' on':''}" data-i="${i}" `
      +`d="M ${x0} ${y0} L ${x1} ${y1} A ${dm.out} ${dm.out} 0 0 1 ${x2} ${y2} L ${x3} ${y3} A ${RAD_IN} ${RAD_IN} 0 0 0 ${x0} ${y0} Z"/>`;
    if(!it) continue;
    const [lx,ly]=pt(dm.lbl,i*step+(step/2-half));
    const dim=it.off?' dim':'';
    const _lt=String(it.t==null?'':it.t);
    const _fs=(_lt.length>4)?Math.max(dm.fs*0.8,dm.fs*4/_lt.length):dm.fs;
    const _arc=Math.max(24,(2*Math.PI*dm.lbl/N-8)/1.10);
    const _sub=String(it.sub==null?'':it.sub);
    const _wrap=(txt,fs)=>{
      if(!txt) return [];
      if(measureText(txt,fs)<=_arc) return [txt];
      let cut=-1, best=1e9;
      for(let i2=1;i2<txt.length;i2++){ if(!/[ \u3000、／\/]/.test(txt[i2-1])) continue;
        const d2=Math.abs(i2-txt.length/2); if(d2<best){ best=d2; cut=i2; } }
      if(cut<0) return [txt];
      return [txt.slice(0,cut).replace(/[ \u3000]+$/,''),txt.slice(cut)];
    };
    const _lines=_wrap(_sub,dm.sub);
    let _sfs=dm.sub; _lines.forEach(L=>{ const w=measureText(L,dm.sub); if(w>_arc) _sfs=Math.min(_sfs,dm.sub*_arc/w); });
    _sfs=Math.max(dm.sub*0.55,_sfs);
    let _tfs=_fs; { const w=measureText(_lt,_fs); if(w>_arc) _tfs=Math.max(dm.fs*0.6,_fs*_arc/w); }
    const _lift=(_lines.length>1)?((_sfs+1.5)/2):0;
    const _ty=(+ly)-_lift+(it.sub?-2:4);
    g+=`<text class="rad-t${dim}" style="font-size:${_tfs.toFixed(2)}px" x="${lx}" y="${_ty.toFixed(2)}">${esc(it.t)}</text>`;
    _lines.forEach((L,li)=>{ g+=`<text class="rad-u${dim}" style="font-size:${_sfs.toFixed(2)}px" x="${lx}" y="${((+ly)-_lift+10+li*(_sfs+1.5)).toFixed(2)}">${esc(L)}</text>`; });
  }
  g+=`<circle class="rad-c" data-i="c" cx="${S/2}" cy="${S/2}" r="${RAD_IN}"/>`;
  g+=`<text class="rad-ct" x="${S/2}" y="${S/2+3}">${esc(center&&center.t||'…')}</text></svg>`;
  el.innerHTML=g; document.body.appendChild(el);
  const svg=el.querySelector('svg');
  const mark=k=>svg.querySelectorAll('.rad-s,.rad-c').forEach(p=>p.classList.toggle('hi',String(p.getAttribute('data-i'))===String(k)));
  const fire=k=>{
    if(k!=='c'&&(!items[k]||items[k].off)){ closeRadial(); if(items[k]) toast(items[k].off); return; }
    closeRadial();
    if(k==='c'){ center&&center.fn&&center.fn(); return; }
    items[k].fn&&items[k].fn();
  };
  let heard=null;
  const hear=k=>{ if(!opt||!opt.hover||k===heard) return; heard=k; const c=(k!=='c'&&k!=null)?opt.hover(k):null; if(c) playChord(c); };
  const onMove=e=>{ if(!_rad) return; const k=radSector(e.clientX-cx,e.clientY-cy,N);
    if(k!=='c'&&k!==null) _rad.moved=true; mark(k===null?'':k); hear(k); };
  const dropDrag=()=>{ document.removeEventListener('pointermove',onMove,true);
    document.removeEventListener('pointerup',onUp,true); document.removeEventListener('pointercancel',onUp,true); mark(''); };
  const onUp=e=>{ if(!_rad) return; e.preventDefault(); e.stopPropagation();
    const k=radSector(e.clientX-cx,e.clientY-cy,N);
    if(k===null){ closeRadial(); return; }
    if(k==='c'){ if(!_rad.moved){ dropDrag(); return; } closeRadial(); return; }
    fire(k); };
  _rad={el,onMove,onUp,moved:false};
  document.body.classList.add('radialing');
  el.addEventListener('pointerdown',e=>{ const k=radSector(e.clientX-cx,e.clientY-cy,N);
    e.preventDefault(); e.stopPropagation(); if(k===null){ closeRadial(); return; } fire(k); });
  el.addEventListener('contextmenu',e=>e.preventDefault());
  el.addEventListener('pointermove',e=>{ if(e.pointerType==='touch') return; const k=radSector(e.clientX-cx,e.clientY-cy,N); mark(k===null?'':k); hear(k); });
  if(drag){ document.addEventListener('pointermove',onMove,true);
    document.addEventListener('pointerup',onUp,true); document.addEventListener('pointercancel',onUp,true); }
}

/* ── 輪の中身 ── */
function sortedNotes(bar){ return bar.notes.slice().sort((a,b)=>a.start-b.start); }
function neighborNote(sec,bi,n,dir){            /* 隣の音符（小節をまたぐ）。休符もそのまま返す */
  const bar=sec.bars[bi], ns=sortedNotes(bar), i=ns.indexOf(n);
  if(dir>0){ if(i>=0&&i<ns.length-1) return {bi,bar,n:ns[i+1]};
    const nb=sec.bars[bi+1]; if(!nb) return null; const f=sortedNotes(nb)[0]; return f&&f.start===0?{bi:bi+1,bar:nb,n:f}:null; }
  if(i>0) return {bi,bar,n:ns[i-1]};
  const pb=sec.bars[bi-1]; if(!pb) return null; const l=sortedNotes(pb).pop();
  return l&&l.start+l.len>=barTicksOf(sec)?{bi:bi-1,bar:pb,n:l}:null;
}
function stopOn(n,s){ return n&&n.kind!=='rest'?(n.stops||[]).find(o=>o.s===s&&typeof o.f==='number'):null; }
const LINK_NM={h:'ハンマリング',p:'プリング',sl:'スライド'};
function linkWhy(v,a,b){                           /* a→b へ v が掛けられるか。掛けられなければ理由 */
  if(!b) return '相手の音符に、同じ弦の押さえがありません';
  if(v==='h'&&!(b.f>a.f)) return 'ハンマリングは、後の音が高い時に掛けられます';
  if(v==='p'&&!(b.f<a.f)) return 'プリングは、後の音が低い時に掛けられます';
  if(v==='sl'&&b.f===a.f) return 'スライドは、フレットが違う音の間に掛けられます';
  return null;
}
function openNoteRing(bi,noteId,str,cx,cy,drag){
  const sec=section(); if(!sec) return;
  const bar=sec.bars[bi], n=bar&&bar.notes.find(x=>x.id===noteId); if(!n) return;
  const noStops=!n.stops||!n.stops.length;
  let o=noStops?null:((n.stops||[]).find(x=>x.s===str)||n.stops[n.stops.length-1]);
  if(o) str=o.s;
  const t=o?(o.t=o.t||{}):{};
  const need=noStops?'この音符にはまだ弦とフレットがありません。縦になぞって置いてください':null;
  const numF=o&&typeof o.f==='number'?null:'×（ミュート音）には付けられません';
  const done=()=>{ touch(song()); renderBars(); renderMelDock(); };
  const act=fn=>()=>{ fn(); done(); };
  const nx=neighborNote(sec,bi,n,1), pv=neighborNote(sec,bi,n,-1);
  const setLink=v=>()=>{
    if(t.link===v){ delete t.link; done(); return; }
    const qn=nx&&stopOn(nx.n,str), qp=pv&&stopOn(pv.n,str);
    openRadial(_radAt.x,_radAt.y,[
      {t:LINK_NM[v].slice(0,1)==='ス'?'／':v.toUpperCase(), sub:'次の音へ', on:!!(qn&&qn.t&&qn.t.link===v),
        off:!nx||nx.n.kind==='rest'?'次に音符がありません':linkWhy(v,o,qn),
        fn:act(()=>{ qn.t=qn.t||{}; if(qn.t.link===v) delete qn.t.link; else qn.t.link=v; })},
      {t:LINK_NM[v].slice(0,1)==='ス'?'／':v.toUpperCase(), sub:'前の音から', on:t.link===v,
        off:!pv||pv.n.kind==='rest'?'前に音符がありません':linkWhy(v,qp,o),
        fn:act(()=>{ t.link=v; })},
    ],{t:'やめる',fn:()=>{}},false);
  };
  const items=[
    {t:'H', sub:'ハンマリング', on:t.link==='h', off:need||numF, fn:setLink('h')},
    {t:'／', sub:'スライド', on:t.link==='sl', off:need||numF, fn:setLink('sl')},
    {t:'〜／', sub:'グリス', on:!!(t.slIn||t.slOut), off:need||numF, fn:()=>openGlissRing(o,cx,cy)},
    {t:'bend', sub:'チョーキング', on:!!t.bend, off:need||numF, fn:()=>openBendRing(sec,bi,n,o,cx,cy)},
    {t:'〜', sub:'ビブラート'+(t.vib?'（'+({q:'クォーター',h:'半音',t:'1音'}[t.vib]||'')+'）':''), on:!!t.vib, off:need||numF, fn:()=>openVibRing(o,cx,cy)},
    {t:'×', sub:'ミュート', on:!!t.mute, off:need, fn:act(()=>{ if(t.mute) delete t.mute; else t.mute=true; })},
    {t:'P.M.', sub:(n.sym&&n.sym.pm)?((n.sym.pmKind==='loose')?'ルーズ':'タイト'):'ブリッジミュート', on:!!(n.sym&&n.sym.pm),
      fn:()=>openPmRing(n,cx,cy)},
    {t:'P', sub:'プリング', on:t.link==='p', off:need||numF, fn:setLink('p')},
    {t:'〈〉', sub:'ハーモニクス', on:!!t.harm, off:need||numF, fn:()=>openHarmRing(o,cx,cy)},
    {t:'T', sub:'タッピング', on:!!t.tap, off:need||(t.mute?'ミュート（×）の押さえは叩けません':null),
      fn:act(()=>{ if(t.tap) delete t.tap; else t.tap=true; })},
    (()=>{                                           /* ⌣：同じ数字ならタイ、違えば H／P */
      const pairs=(n.stops||[]).map(a=>{ const b=nx&&stopOn(nx.n,a.s); return (b&&typeof a.f==='number')?{a,b}:null; }).filter(Boolean);
      const on=pairs.length>0&&pairs.every(pr=>pr.b.t&&['tie','h','p'].includes(pr.b.t.link));
      const why=on?null:(!nx||nx.n.kind==='rest')?(nx&&nx.bi!==bi?'次の小節の頭に音符がありません':'次に音符がありません')
               :(!pairs.length?'次の音符に、同じ弦の押さえがありません':null);
      return {t:'⌣', sub:on?'つながりを外す':(nx&&nx.bi!==bi?'次の小節へ 弧でつなぐ':'次へ 弧でつなぐ'), on, off:need||why,
        fn:act(()=>{ pairs.forEach(pr=>{ pr.b.t=pr.b.t||{};
          if(on){ if(['tie','h','p'].includes(pr.b.t.link)) delete pr.b.t.link; }
          else pr.b.t.link=pr.b.f===pr.a.f?'tie':(pr.b.f>pr.a.f?'h':'p'); }); })};
    })(),
    {t:'♪', sub:'装飾音符', on:!!t.grace, off:need||numF, fn:()=>openGraceRing(o,pv,cx,cy)},
  ];
  openRadial(cx,cy,items,{t:'くわしく',fn:()=>{ MI.cur={barId:bar.id,tick:n.start,s:str}; openTech(); }},drag);
}
function ringDone(){ touch(song()); renderBars(); renderMelDock(); }
const DETAIL={t:'くわしく',fn:()=>openTech()};
function openGlissRing(o,cx,cy){
  const t=o.t=o.t||{};
  const tg=(k,v)=>()=>{ if(t[k]===v) delete t[k]; else t[k]=v; ringDone(); };
  openRadial(cx,cy,[
    {t:'／', sub:'上へ抜ける', on:t.slOut==='up', fn:tg('slOut','up')},
    {t:'＼', sub:'下へ抜ける', on:t.slOut==='down', fn:tg('slOut','down')},
    {t:'／', sub:'下から入る', on:t.slIn==='up', fn:tg('slIn','up')},
    {t:'＼', sub:'上から入る', on:t.slIn==='down', fn:tg('slIn','down')},
  ],DETAIL,false);
}
function openBendRing(sec,bi,n,o,cx,cy){
  const t=o.t=o.t||{}, cur=t.bend?t.bend.amt:null;
  const set=v=>()=>{ if(cur===v) delete t.bend; else t.bend={amt:v,pre:!!(t.bend&&t.bend.pre)}; ringDone(); };
  const mk=(v,name)=>({t:BEND_TXT[v]||String(v), sub:name, on:cur===v, fn:set(v)});
  const pv=neighborNote(sec,bi,n,-1), nx=neighborNote(sec,bi,n,1);
  const pvO=pv&&stopOn(pv.n,o.s), nxO=nx&&stopOn(nx.n,o.s);
  const pvBent=!!(pvO&&pvO.t&&pvO.t.bend&&pvO.t.bend.amt>0);
  const items=[
    mk(2,'2音'),
    {t:'↑', sub:'チョークアップ', on:!!(t.bend&&t.bend.pre),
      fn:()=>{ t.bend=Object.assign({amt:1},t.bend||{},{pre:!(t.bend&&t.bend.pre)}); ringDone(); }},
    mk(1.5,'1音半'),
    {t:'～', sub:'ポルタメント', off:'ScoreLineCompassではまだ使えません'},
    mk(1,'1音'),
    mk(0.25,'クォーター'),
    mk(0.5,'半音'),
    pvBent
      ? {t:'D', sub:'この音で戻す', on:t.link==='bd', fn:()=>{ if(t.link==='bd') delete t.link; else t.link='bd'; ringDone(); }}
      : {t:'D', sub:'次の音で戻す', on:!!(nxO&&nxO.t&&nxO.t.link==='bd'),
          off:!t.bend?'先に上げ幅を選んでください':(!nxO?'次の音符に、同じ弦の押さえがありません':null),
          fn:()=>{ nxO.t=nxO.t||{}; if(nxO.t.link==='bd') delete nxO.t.link; else nxO.t.link='bd'; ringDone(); }},
  ];
  openRadial(cx,cy,items,DETAIL,false);
}
function openVibRing(o,cx,cy){
  const t=o.t=o.t||{};
  const set=v=>()=>{ if(v==null||t.vib===v) delete t.vib; else t.vib=v; ringDone(); };
  const it=(k,nm)=>({t:'〜', sub:nm, on:t.vib===k, fn:set(k)});
  openRadial(cx,cy,[it('t','1音'),null,it('h','半音'),null,it('q','クォーター'),null,
    {t:'外す', sub:t.vib?'ビブラートを外す':'', off:t.vib?null:'まだ付いていません', fn:set(null)},null],DETAIL,false);
}
function openPmRing(n,cx,cy){
  const sy=n.sym=n.sym||{};
  const set=k=>()=>{ if(sy.pm&&(sy.pmKind||'tight')===k){ delete sy.pm; delete sy.pmKind; } else { sy.pm=true; sy.pmKind=k; } ringDone(); };
  openRadial(cx,cy,[
    {t:'タイト', sub:'詰まって短い', on:!!sy.pm&&(sy.pmKind||'tight')==='tight', fn:set('tight')},
    {t:'ルーズ', sub:'ゆるく長め', on:!!sy.pm&&sy.pmKind==='loose', fn:set('loose')},
  ],DETAIL,false);
}
function openHarmRing(o,cx,cy){
  const t=o.t=o.t||{};
  const set=v=>()=>{ if(t.harm===v) delete t.harm; else t.harm=v; ringDone(); };
  openRadial(cx,cy,[
    {t:'〈 〉', sub:'ナチュラル', on:t.harm==='n', fn:set('n')},
    {t:'[ ]', sub:'人工', on:t.harm==='a', fn:set('a')},
    {t:'[ ]', sub:'ピッキング', on:t.harm==='p', fn:set('p')},
  ],DETAIL,false);
}
function openGraceRing(o,pv,cx,cy){
  const t=o.t=o.t||{};
  const pvO=pv&&stopOn(pv.n,o.s);
  const why=!pvO?'前の音符に、同じ弦の押さえがありません':(pvO.f===o.f?'前の音と同じフレットです':null);
  openRadial(cx,cy,[
    {t:'⌣ '+(pvO?pvO.f+'F':'前の音'), sub:'前の音から繋ぐ', on:!!(t.grace&&pvO&&t.grace.f===pvO.f), off:why,
      fn:()=>{ t.grace={f:pvO.f,link:pvO.f<o.f?'h':'p'}; ringDone(); }},
    {t:'⟨♪⟩', sub:'飾りを付ける', fn:()=>openTech()},
    {t:'外す', sub:t.grace?'装飾音符を外す':'', off:t.grace?null:'まだ付いていません', fn:()=>{ delete t.grace; ringDone(); }},
  ],DETAIL,false);
}

/* ════════ コードの輪とおまかせ ════════
   空いたマスを押す → その場所のメロディと前の流れに合うコードが輪になって出る。押せば置ける。
   置いてあるコードを押す → 代理・差し替えの輪。中心の〈くわしく〉で、これまでの画面へ。
   〈おまかせ〉→ コードの無い小節に、メロディに一番合うコードを付ける。 */
/* キー外の音の扱い。
   メロディにキー外の音がなければ、これまでどおりキー内のコードを必ず上にする。
   キー外の音があれば、それを構成音に持つコードを上げ、説明できないコードを下げる
   （例：C キーでド♯が鳴れば、A7 が Em より上に来る）。 */
function keyOutAdjust(sec,W,total,list){
  if(!total) return;
  const r=PC[sec.key], sc=(sec.minor?[0,2,3,5,7,8,10,11]:[0,2,4,5,7,9,11]).map(i=>(r+i)%12);
  const outs=Object.keys(W).map(Number).filter(pc=>!sc.includes(pc)), outW=outs.reduce((a,pc)=>a+W[pc],0)/total;
  if(outW<0.08){ const bd=Math.max(...list.filter(x=>x.dia).map(x=>x.score)); list.forEach(x=>{ if(!x.dia) x.score=Math.min(x.score,bd-3); }); return; }
  list.forEach(x=>{ const p=chordPcs(x.c); if(!p) return;
    const ex=outs.reduce((a,pc)=>a+(p.set.includes(pc)?W[pc]:0),0)/total/outW;
    x.score+=Math.round(30*outW*(ex*2-1)); });
}
function spotFit(sec,bi,t0,t1){
  const bar=sec.bars[bi], {W,total}=melodyWeights(sec,bar,t0,t1);
  const prev=chordsBefore(sec,bi,Math.round(t0/(TPQ/2)));
  const flow=nextCandidates(sec,prev).map(x=>{ const p=chordPcs(x.c); return p?p.root:-1; });
  const seen=new Set(), list=[];
  candidateChords(sec).forEach(x=>{ if(seen.has(x.c)) return; seen.add(x.c);
    let sc=total?Math.min(100,scoreChord(x.c,W,total)+(x.dia?6:0)):(x.dia?30:0);
    const p=chordPcs(x.c), fi=p?flow.indexOf(p.root):-1;
    if(fi>=0&&x.dia) sc+=(total?8:40)-fi*(total?1:5);
    list.push(Object.assign({},x,{score:sc,flow:fi>=0})); });
  keyOutAdjust(sec,W,total,list);
  list.sort((a,b)=>b.score-a.score);
  return {list,total};
}
function slotSpan(sec,bar,t){                      /* 押したマスから、次のコード（無ければ小節の終わり）まで */
  const cells=tsInfo(sec.ts).cells, nx=bar.chords.filter(c=>c.t>t).map(c=>c.t).sort((a,b)=>a-b)[0];
  return {t0:t*(TPQ/2),t1:(nx!=null?nx:cells)*(TPQ/2)};
}
function openChordRing(bi,t,cx,cy){
  const sec=section(), bar=sec.bars[bi]; if(!bar) return;
  const ch=chordAt(bar,t);
  const done=c=>{ renderBars(); if(song().guideOn) renderGuide(); if(c) playChord(c); };
  if(ch){                                          /* 置いてあるコード：代理・差し替え */
    const subs=subsFor(sec,ch.c,{next:nextChordAfter(sec,bi,t)});
    const items=subs.map(x=>x.kind==='before'
      ?{t:'→'+x.c,sub:'前に入れる',c:x.c,fn:()=>{ if(insertBefore(sec,bi,ch,x.c)) done(x.c); }}
      :{t:x.c,sub:x.why.replace(/（.*$/,'').replace(/^次の (\S+) へ.*$/,'次の$1へ'),c:x.c,off:chordDupWhy(sec,bi,t,x.c),
        fn:()=>{ ch.c=x.c; touch(song()); done(x.c); }});
    items.push({t:'×',sub:'このコードを消す',fn:()=>{ bar.chords=bar.chords.filter(x=>x!==ch); touch(song()); done(); }});
    openRadial(cx,cy,items,{t:'くわしく',fn:()=>chipSheet(bi,ch)},false,{hover:k=>items[k]&&items[k].c});
    return;
  }
  const sp=slotSpan(sec,bar,t), F=spotFit(sec,bi,sp.t0,sp.t1);
  const per={}, pick=[];
  for(const x of F.list){ const p=chordPcs(x.c), r=p?p.root:x.c; per[r]=(per[r]||0)+1; if(per[r]>2) continue; pick.push(x); if(pick.length>=8) break; }
  const items=pick.map(x=>({t:x.c,sub:x.dia?x.dg:'借用',c:x.c,on:false,off:chordDupWhy(sec,bi,t,x.c),
    fn:()=>{ if(place(bi,t,x.c)) done(x.c); }}));
  openRadial(cx,cy,items,{t:'ほかの',fn:()=>otherChordSheet({bi,t})},false,{hover:k=>items[k]&&items[k].c});
  if(!F.total) toast('ここにはメロディが無いので、前の流れから選んでいます',2500);
}
function autoChords(){
  const s=song(); if(!s) return;
  const sel=barSelRange(), F=flatBars(s);
  const list=sel?F.slice(sel.lo,sel.hi+1):F;      /* 選んでいなければ曲ぜんぶ */
  let put=0, keep=0, target=0;
  list.forEach(x=>{ const sec=x.sec, bar=x.b, i=sec.bars.indexOf(bar); if(bar.chords.length) return; target++;
    const cells=tsInfo(sec.ts).cells;
    const FF=spotFit(sec,i,0,cells*(TPQ/2)), best=FF.list[0]; if(!best) return;
    const prev=chordsBefore(sec,i,0).slice(-1)[0];
    if(prev===best.c){ keep++; return; }          /* 前と同じなら置かない（続いているのと同じ） */
    bar.chords.push({t:0,c:best.c,syn:false}); put++; });
  if(!target) return toast(sel?'選んだ範囲に、コードの無い小節がありません。置いてあるコードは、押すと差し替えられます':'コードの無い小節がありません。置いてあるコードは、押すと差し替えられます',3500);
  touch(s); renderBars(); renderPalette();
  toast(`${target}小節のうち${put}小節にコードを付けました`+(keep?`（${keep}小節は前のコードが続きます）`:'')+'。押せば差し替えられます',5000);
}

/* ════════ 奏法パネル（第2段階 2-3）════════
   データの形は ScoreLineTAB に合わせる。
   押さえごと（stop.t）：link / bend{amt,pre} / slIn / slOut / vib / trill / tap / harm / mute / grace{f,link}
   音符ごと：accent / staccato / stroke / kind:'brush' / sym{pm,pmKind,ring,arm,trem,rake,scratch,rasg,arp,fermata,tempo,hair,text} */
function techTargets(){
  const sec=section(); if(!sec) return [];
  let list=[];
  if(MI.picked.size) song().sections.forEach(sg=>sg.bars.forEach(b=>b.notes.forEach(n=>{ if(MI.picked.has(n.id)&&n.kind!=='rest') list.push(n); })));
  else { const n=noteAtCursor(); if(n&&n.kind!=='rest') list=[n]; }
  return list;
}
function techStops(n){       // 弦を選んでいればその弦だけ、なければ全部
  const st=n.stops||[]; if(MI.cur&&MI.cur.s!=null){ const o=st.find(x=>x.s===MI.cur.s); if(o) return [o]; } return st;
}
function openTech(){
  const list=techTargets();
  if(!list.length) return toast('奏法を付ける音符を選んでください（音符の位置を押すか、〈選択〉で選びます）');
  const n0=list[0], o0=techStops(n0)[0]||{t:{}}, t0=o0.t||{}, s0=n0.sym||{};
  const B=(grp,val,label,on)=>`<button class="tb${on?' on':''}" data-g="${grp}" data-v="${esc(String(val))}">${label}</button>`;
  const row=(title,btns)=>`<div class="trow"><div class="tt">${title}</div><div class="tbs">${btns}</div></div>`;
  const opts=(grp,cur,arr)=>arr.map(([v,l])=>B(grp,v,l,String(cur==null?'':cur)===String(v))).join('');
  const strLabel=MI.cur&&MI.cur.s!=null&&(n0.stops||[]).some(x=>x.s===MI.cur.s)?`${6-MI.cur.s}弦`:'すべての弦';
  sheet(`<h2>奏法　<small style="font-weight:400;color:var(--on-ink-dim)">${list.length>1?list.length+'個の音符':'この音符'}（押さえの奏法は${strLabel}）</small></h2>
    <details open class="tsec"><summary>長さ</summary>
      ${row('音価',[[T.WHOLE,'全音符'],[T.HALF,'2分'],[T.QUARTER,'4分'],[T.EIGHTH,'8分'],[T.SIXTEENTH,'16分'],[T.THIRTY2,'32分']].map(([u,l])=>B('len',u,l,n0.len===u)).join('')
        +[[Math.round(T.HALF*1.5),'付点2分'],[Math.round(T.QUARTER*1.5),'付点4分'],[Math.round(T.EIGHTH*1.5),'付点8分'],[T.TRIP4,'4分3連'],[T.TRIP8,'8分3連'],[T.TRIP16,'16分3連']].map(([u,l])=>B('len',u,l,n0.len===u)).join(''))}
    </details>
    <details open class="tsec"><summary>音のつなぎ（前の音から）</summary>
      ${row('つなぎ',opts('link',t0.link&&t0.link!=='bd'?t0.link:'',[['','なし'],['tie','タイ'],['h','ハンマリング'],['p','プリング'],['sl','スライド'],['gl','グリッサンド'],['leg','スラー']]))}
    </details>
    <details open class="tsec"><summary>チョーキング</summary>
      ${row('上げ幅',opts('bend',t0.bend?t0.bend.amt:'',[['','なし'],[0.5,'半音'],[1,'1音'],[1.5,'1音半'],[2,'2音']]))}
      ${row('',B('bendPre',1,'事前チョーキング',!!(t0.bend&&t0.bend.pre))+B('link','bd','戻す（前の音から）',t0.link==='bd'))}
    </details>
    <details class="tsec"><summary>音の出入り</summary>
      ${row('スライドイン',opts('slIn',t0.slIn||'',[['','なし'],['up','下から入る'],['down','上から入る']]))}
      ${row('スライドアウト',opts('slOut',t0.slOut||'',[['','なし'],['up','上へ抜ける'],['down','下へ抜ける']]))}
    </details>
    <details class="tsec"><summary>揺らし</summary>
      ${row('ビブラート',opts('vib',t0.vib||'',[['','なし'],['q','クォーター'],['h','半音'],['t','1音']]))}
      ${row('アーム',opts('arm',s0.arm||'',[['','なし'],['dip','軽く揺らす'],['dive','大きく下げる']]))}
      ${row('トリル',`<input id="trF" type="number" min="0" max="24" placeholder="相手のフレット" value="${t0.trill!=null?t0.trill:''}" style="width:130px">`+B('trill','set','付ける',false)+B('trill','','外す',false))}
    </details>
    <details class="tsec"><summary>弾き方（音ごと）</summary>
      ${row('',B('tap',1,'タッピング',!!t0.tap)+B('mute',1,'ミュート音（×）',!!t0.mute))}
      ${row('ハーモニクス',opts('harm',t0.harm||'',[['','なし'],['n','ナチュラル'],['a','人工'],['p','ピッキング']]))}
    </details>
    <details class="tsec"><summary>弾き方（音符ごと）</summary>
      ${row('ブリッジミュート',opts('pm',s0.pm?(s0.pmKind||'tight'):'',[['','なし'],['tight','タイト'],['loose','ルーズ']]))}
      ${row('ピッキングの向き',opts('stroke',n0.stroke||'',[['','なし'],['down','ダウン'],['up','アップ']]))}
      ${row('ピックスクラッチ',opts('scratch',s0.scratch||'',[['','なし'],['down','下へ'],['up','上へ']]))}
      ${row('',B('ring',1,'レットリング',!!s0.ring)+B('staccato',1,'スタッカート',!!n0.staccato)+B('accent',1,'アクセント',!!n0.accent)+B('trem',1,'トレモロピッキング',!!s0.trem)
        +B('rake',1,'レイキング',!!s0.rake)+B('brush',1,'ブラッシング',n0.kind==='brush')+B('rasg',1,'ラスゲアード',!!s0.rasg)+B('arp',1,'アルペジオ記号',!!s0.arp))}
    </details>
    <details class="tsec"><summary>装飾音符</summary>
      ${row('フレット',`<input id="grF" type="number" min="0" max="24" value="${t0.grace?t0.grace.f:''}" style="width:90px">`)}
      ${row('つなぎ',opts('graceLink',t0.grace?(t0.grace.link||''):'h',[['','なし'],['h','ハンマリング'],['p','プリング'],['sl','スライド']]))}
      ${row('',B('grace','set','付ける',false)+B('grace','','外す',false))}
    </details>
    <details class="tsec"><summary>記号</summary>
      ${row('',B('fermata',1,'フェルマータ',!!s0.fermata))}
      ${row('強弱',opts('hair',s0.hair||'',[['','なし'],['cresc','だんだん強く'],['dim','だんだん弱く']]))}
      ${row('テンポ',`<input id="tmp" type="number" min="30" max="300" value="${s0.tempo||''}" style="width:90px">`+B('tempo','set','決める',false)+B('tempo','','外す',false))}
      ${row('注釈',`<input id="txt" value="${esc(s0.text||'')}" style="width:160px">`+B('text','set','決める',false)+B('text','','外す',false))}
    </details>
    <div class="btns"><button class="tb pri" id="tClose">閉じる</button></div>`,sh=>{
    const keepOpen=[...sh.querySelectorAll('details')].map(d=>d.open);
    sh.querySelector('#tClose').onclick=closeSheet;
    sh.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{
      applyTech(list,b.dataset.g,b.dataset.v,sh);
      const opened=[...sh.querySelectorAll('details')].map(d=>d.open), sc=sh.scrollTop;
      touch(song()); renderBars(); openTech();
      const nsh=document.querySelector('.sheet'); if(nsh){ [...nsh.querySelectorAll('details')].forEach((d,i)=>d.open=opened[i]); nsh.scrollTop=sc; }
    });

}
function applyTech(list,g,v,sh){
  const numOr=(el)=>{ const x=sh.querySelector(el).value; return x===''?null:Math.max(0,Math.min(24,Math.round(+x))); };
  const firstT=(techStops(list[0])[0]||{}).t||{}, firstN=list[0], firstS=firstN.sym||{};
  const stopT=fn=>list.forEach(n=>techStops(n).forEach(o=>{ o.t=o.t||{}; fn(o.t,o,n); }));
  const noteSym=fn=>list.forEach(n=>{ n.sym=n.sym||{}; fn(n.sym,n); });
  const clean=obj=>Object.keys(obj).forEach(k=>{ if(obj[k]==null||obj[k]===false||obj[k]==='') delete obj[k]; });
  switch(g){
    case 'len': {                       /* 音符の長さ（ScoreLineTAB の〈音価を変える〉に当たる） */
      song().sections.forEach(sg=>sg.bars.forEach(b=>list.forEach(n=>{ const i=b.notes.indexOf(n); if(i>=0) setNoteLen(sg,b,i,+v); })));
      break; }
    case 'link': stopT(t=>{ t.link=(v===''||t.link===v&&v==='bd')?null:v; clean(t); }); break;
    case 'bend': stopT(t=>{ if(v==='') delete t.bend; else t.bend={amt:+v,pre:!!(t.bend&&t.bend.pre)}; }); break;
    case 'bendPre': { const on=!(firstT.bend&&firstT.bend.pre); stopT(t=>{ t.bend=Object.assign({amt:1},t.bend||{},{pre:on}); }); break; }
    case 'slIn': case 'slOut': case 'vib': case 'harm': stopT(t=>{ t[g]=v||null; clean(t); }); break;
    case 'tap': case 'mute': { const on=!firstT[g]; stopT(t=>{ t[g]=on; clean(t); }); break; }
    case 'trill': { const f=v?numOr('#trF'):null; if(v&&f==null) return toast('相手のフレットを入れてください'); stopT(t=>{ t.trill=f; clean(t); }); break; }
    case 'grace': { const f=v?numOr('#grF'):null; if(v&&f==null) return toast('装飾音符のフレットを入れてください');
      const lk=(sh.querySelector('[data-g=graceLink].on')||{dataset:{v:'h'}}).dataset.v;
      stopT(t=>{ if(v) t.grace={f,link:lk||null}; else delete t.grace; }); break; }
    case 'graceLink': stopT(t=>{ if(t.grace) t.grace.link=v||null; }); 
      sh.querySelectorAll('[data-g=graceLink]').forEach(b=>b.classList.toggle('on',b.dataset.v===v)); break;
    case 'arm': case 'scratch': case 'hair': noteSym(s=>{ s[g]=v||null; clean(s); }); break;
    case 'pm': noteSym(s=>{ if(v){ s.pm=true; s.pmKind=v; } else { delete s.pm; delete s.pmKind; } }); break;
    case 'ring': case 'trem': case 'rake': case 'rasg': case 'arp': case 'fermata': { const on=!firstS[g]; noteSym(s=>{ s[g]=on; clean(s); }); break; }
    case 'tempo': { const x=sh.querySelector('#tmp').value, val=v?clampTempo(x,null):null; if(v&&!val) return toast('テンポは30〜300で入れてください'); noteSym(s=>{ s.tempo=val; clean(s); }); break; }
    case 'text': { const x=sh.querySelector('#txt').value.trim(); noteSym(s=>{ s.text=v?x||null:null; clean(s); }); break; }
    case 'stroke': list.forEach(n=>{ if(v) n.stroke=v; else delete n.stroke; }); break;
    case 'staccato': case 'accent': { const on=!firstN[g]; list.forEach(n=>{ if(on) n[g]=true; else delete n[g]; }); break; }
    case 'brush': { const on=firstN.kind!=='brush'; list.forEach(n=>n.kind=on?'brush':'note'); break; }
  }
}

/* ════════ 使い方 ════════ */
function helpSheet(){
  sheet(`<h2>使い方</h2>
    <p><b>曲の一覧</b>：〈＋ 新しい曲〉で、作り始め方を選んで曲を作ります。〈…〉から名前の変更・複製・書き出し・削除ができます。</p>
    <p><b>譜面</b>：曲は最初から最後まで一本の譜面です。小節の番号を押すと、その小節の設定が開きます。</p><p><b>目印</b>：小節の設定で「Aメロ」「サビ」などの目印を付けられます。付けた目印は譜面の上に並び、押すとその小節へ移ります。</p><p><b>オクターブ記号</b>：小節の設定から 8va・8vb を付けられます。ギターの音の時は、付けた小節の音符がその分だけ下げて（上げて）書かれ、加線が減ります。鳴る音とTABの数字は変わりません。笛・ピアノの音の時は、音符の位置は動かず、括弧の中が1オクターブ上（8vb は下）で鳴ります。続けて付けた小節は、破線の括弧でつながります。破線を押すと選べて、両端の丸を引くと音符の位置で範囲を伸ばしたり縮めたりできます（段をまたいでも引けます）。選んでいる間は〈消す〉や〈8vb にする〉が出ます。Delete でも消せます。高い音で加線が増えたときは、その都度お知らせします。</p><p><b>小節を複製</b>：小節の設定の〈ここから何小節かを複製〉で、選んだ範囲をすぐ後ろに入れます（別々に直せます）。</p><p><b>小節をまとめて扱う</b>：〈選択〉の〈小節〉で範囲をなぞると、〈複製〉〈目印〉〈8va〉〈消す〉が使えます。〈8va〉は選んだ小節ぜんぶにオクターブ記号を付けます。〈目印〉は範囲の先頭に付きます。消したものは ↶ で戻せます。</p>
    <p><b>譜面</b>：〈五線譜〉〈TAB〉で表示を切り替えます。〈1段の小節数〉は曲ごとに覚えます。</p>
    <p><b>後始末</b>：小節はつねに埋まります。音符の入っていない所には、書ける音価に割った休符が自動で入り、そこへ音符を置けば休符は削られます。音符を消せば、また休符に戻ります。</p>
    <p><b>数字の打ち方</b>：数字キーでフレットを置きます。〈送り〉が切なら同じマスで続けて打つと二桁、入なら打つたびに次のマスへ進み、素早く続けて打てば二桁になります。</p>
    <p><b>モード</b>：帯の左の〈入力〉〈コード〉〈選択〉で切り替えます。</p>
    <p><b>メロディ</b>：〈入力〉では、縦になぞるとフレット（五線譜では半音ずつ）、横になぞると長さが決まります。何も無い所からなぞれば、その場に音符ができます。0より下へ引き切ると消えます。五線譜では、音符の符頭の高さを押すとその音符を選び、同じ位置でも違う高さを押すとそこへ音が入ります（音符の頭なら高さの書き換え、長い音符の途中ならそこで区切って置きます）。</p>
    <p><b>奏法</b>：TABでは音符を長押しすると奏法の輪が出ます。指を滑らせて離すか、離してから押して選びます。中心の〈くわしく〉で、すべての奏法と長さを選べます。五線譜では長押しが掴みになりますので、奏法は〈選択〉で音を選んでから付けます。</p>
    <p><b>音符を動かす</b>：五線譜で音符を長押しして掴み、横へ動かします。休符の上へ動かすとそのマスへ移り、元の場所は休符になります。別の音符の上へ動かすと、その音符と入れ替わります。上下に動かすと音の高さが半音ずつ変わります（TABでは弦が変わります）。歌詞は動かず、左から何番目の歌詞かはそのまま残ります。</p>
    <p><b>キーボード</b>：スペース＝鳴らす・止める／←・→＝鳴らしている間と音符のカーソルが無い時は1小節ずつ移る（⇧←・⇧→ならいつでも。帯の◀▶と同じ）／数字＝フレット／↑↓＝弦／←→・Tab・Enter＝マスの移動／T＝タイ／H＝ハンマリング／P＝プリング／S＝スライド（直前に置いた音へ。もう一度で外れます）／U＝チョークアップ／D＝チョークダウン／B＝チョーキング／V＝ビブラート／G＝グリス／M＝ミュート／⌥D・⌥U＝ピッキングの向き／⌥4・⌥8・⌥6・⌥3＝刻み／Esc＝送りを切る／⌘C・⌘X・⌘V＝コピー・切り取り・貼り付け／⌘A＝ぜんぶ選ぶ／⌘Z・⇧⌘Z＝元に戻す・やり直す。</p>
    <p><b>歌詞</b>：歌詞の段は一本です。メロディのある小節では音符の真下の欄に打ちます。一字打ってスペースかTabで次の音符へ進みます。スペースで区切った一行を貼り付けると、音符へ順に割り当て、次の小節へも送ります。音符より言葉が多い時は、余りを小節の下に残します（茶色の斜体の欄）。メロディの無い小節では小節の幅の欄になり、歌詞の下書きを置けます。譜面の上の〈歌詞〉で、歌詞の段を出す・隠すを切り替えます。</p>
    <p><b>再生の位置</b>：再生の帯の上のバーで、今どこを鳴らしているかが分かります。つまんで動かすとその位置から鳴らします。細い線は小節、太い線はキーやテンポなどの変わり目です。⏮ で先頭へ戻り、〈追う〉を入れると、鳴らしている小節へ画面が送られます。</p>
    <p><b>ループ</b>：再生の帯の〈⟳ ループ〉で繰り返しを入れます。鳴らしながらでも、ふだんどおり入力やコードの差し替えができ、直した音はすぐ聞こえます。範囲は、帯の〈範囲を引く〉を押してから小節を押すかなぞります。範囲なしなら曲全体を繰り返します。範囲は〈1〜4〉の席に控えられ、〈⟳ ループ〉の長押しでも選べます。鳴らしながら引き直すと、その範囲の頭から鳴り直します。</p>
    <p><b>メロディの音</b>：下の再生の帯で、ギター・笛・ピアノから選べます。ギターは実際のギターの高さ（五線に書いた音の1オクターブ下）で鳴ります。笛とピアノは歌のメロディ用なので、五線に書いた高さで鳴り、ト音記号の下の「8」が外れます。〈音色の調整〉で、明るさや息の音、余韻の長さなどを曲ごとに変えられます。</p>
    <p><b>ミキサー</b>：下の帯の〈ミキサー〉で開きます。伴奏・ドラム・メロディ・全体の音量（フェーダー）、響きの量（つまみ）、〈消音〉を曲ごとに変えられます。伴奏の欄で伴奏の楽器（ギター・ピアノ）を、メロディの欄で音色（ギター・笛・ピアノ）と〈音色の調整〉を選べます。ピアノの伴奏は、左手でベース、右手でコードの音をまとめて弾き、次の一打まで伸ばします。鳴らしている間は、音の大きさが目盛りに光ります。下の帯の〈ドラム〉を押すと、ドラムの型を選ぶ画面が開きます。</p>
    <p><b>長さ</b>：右へ引くと長く、頭より左へ引くと頭が前へ伸びます。小節線を越えると、次の小節へタイでつなぎます。</p>
    <p><b>音符と休符</b>：帯の〈音符〉〈休符〉、または右クリック・二本指タップで持ち替えます。休符のときは、押した所・なぞった範囲が休符になります。</p>
    <p><b>選択</b>：〈選択〉で音符を押すか横になぞって選び、帯の道具を使います。〈⌣ つなぐ〉は、同じ数字ならタイ、違えばハンマリング・プリングでつなぎます。</p>
    <p><b>小節の入れ替え・複製</b>：小節番号を押すと、前後の小節と入れ替える・この小節を複製する、が選べます。</p>
    <p><b>音符を動かす</b>：五線譜では〈入力〉のまま、音符を長押ししてからドラッグします。その場で縦に動かせば音の高さが変わります。横に動かすと、その音符がその場所に差し込まれ、前後の音符はその分ずれます（同じ小節の中だけ・長さはそのまま）。TABでは〈選択〉で長押ししてからドラッグし、縦は弦（鳴る音はそのまま）が変わります。</p><p><b>♯と♭の書き替え</b>：五線譜の♯・♭を押すと、異名同音に書き替わります（C♯ ⇔ D♭ など）。その小節の同じ高さの音もまとめて書き替わります。鳴る音は変わりません。調号で付いている♯・♭は押せません。</p><p><b>音を押したとき</b>：その音が鳴り、位置が選ばれます。TABでは、次に何も無い所を押した時に、そのフレットの数字が置かれます。</p>
    <p><b>拍ごとの刻み</b>：小節番号を押すと、拍ごとに刻みを変えられます。下の帯と違う刻みの拍は、譜面で薄く色が付きます。</p>
    <p><b>マス</b>：〈マス〉で、刻みの線・拍の線・出さない、を切り替えます。マスの切れ目は刻みと音符の頭の合併なので、刻みを変えても、すでにある音符は必ずマスに載ります。押した位置とカーソルはマスに吸い付きます。</p>
    <p><b>元に戻す</b>：上や帯の右端の ↶ ↷ で、コード・歌詞・目印を含めて元に戻す・やり直すができます。パソコンでは Ctrl（⌘）+Z も使えます。</p>
    <p><b>コードを置く</b>：コードの段の空いたマスを押すと、そこのメロディと前の流れに合うコードが輪になって出ます。押せば置けます（パソコンでは、マウスを乗せると鳴ります）。置いてあるコードを押すと、代理・差し替えの輪が出ます。〈おまかせ〉は、コードの無い小節にメロディに一番合うコードを付けます。下のパレットから選んでマスを押す置き方も使えます。</p>
    <p><b>コードの候補</b>：〈候補〉を押すと、その小節（前半・後半も選べます）のメロディに合うコードを点数付きで出します。← → でコードを選んでいる時は、そのコードが鳴っている範囲のメロディで選び、押すと選んだコードが差し替わります。〈選択〉で小節の範囲を選んでいるときは、その範囲ぜんぶのメロディで選び、押すと範囲の先頭に置きます。〈おまかせ〉も同じ範囲に効きます。キー内のコードが上に、借用したコードが点線の枠で下に並びます。〈いつも出す〉を入れると開いたままになります。隣には、今までの進行から見て次に置くと収まるコードも出ます。</p>
    <p><b>コードを選んでたどる</b>：〈コード〉の帯の ← → で、譜面のコードを一つずつ選べます。パソコンでは矢印キーの ← → でも同じように辿れます（Shift を押しながらなら小節を移ります）。Delete（Backspace）キーでも消せます。選んだコードは光って鳴り、パレットのコードを押すとその場で差し替え、⌫で消せます。〈候補〉もその小節を見ます。</p>
    <p><b>代理コード</b>：コードを選んでいるときは〈代理〉ですぐ開きます。選んでいないときは、〈代理〉を押すと帯に「差し替えるコードを押してください」と出ます。譜面のコードを押すとそれが光り、小窓が開きます。置いたコードを押して〈代理・差し替え…〉からも開けます。同じ役割の和音、セカンダリードミナント、裏コード、バックドア、同主調からの借用、sus4 などを、聴き比べて差し替えられます。</p>
    <p><b>色分け</b>：メロディの帯の〈色分け〉を入れると、指板がその場所のコードに対して色分けされ（和音の音・足せる音・濁りやすい音・キーの外）、譜面の音符にも印が付きます。</p>
    <p><b>まとめて置く</b>：コードを一度押して持った状態にしてから、マスを次々押すと、同じコードを続けて置けます。〈やめる〉で放します。</p>
    <p><b>置いたコード</b>：押すと名前の変更や削除ができます。長押しで食い（八分音符ひとつ前から鳴らす）を付け外しします。食いのコードは元の拍に書かれ、すぐ前の八分からコード名へ向かって弧が入ります（小節の頭の食いは、前の小節の最後の八分から）。伴奏は食った位置で鳴って元の拍では弾き直しません。ドラムの画面の〈食いに合わせる〉がオンなら、ドラムも食った位置でバスドラムとシンバルを叩き、元の拍の頭は休みます。すぐ前の八分にコードがある時は食いにできません。小節の頭の食いは、前の小節の最後に書かれます。</p>
    <p><b>コードを動かす</b>：コードを押したまま動かすと、つまんで移せます。空いたマスに落とすとそこへ移り、別のコードの真ん中に落とすと置き換わります（置き換わる側が赤く示されます）。別のコードのマスの左端に当てるとそのコードを右へ、右端に当てると左へ1マス押し、続いて並んでいるコードも一緒にずれます。押せるのは小節の中だけです。</p>
    <p><b>キー・拍子・テンポ</b>：譜面の上の「Key ・ 拍子 ・ ♩=」を押して選びます。伴奏・ドラムも同じ所で選べます。これらは曲全体に効きます。途中から変えたいときは、小節の設定の〈この小節から変える〉を使います。譜面のト音記号（TABならTABの記号）を押しても、五度圏からキーを選べます。先頭の小節なら曲全体、それ以外はその小節から次に変わる所までに効きます。転調した小節は段を改め、手前は複縦線になります。記号だけを段の途中に出したいときは、小節の設定の〈この小節に記号を出す〉を使います。キーの小窓には、メロディとコードから割り出した合いそうなキーも出ます。キーを変えるときは、音符とコードも一緒に移すか選べます。</p>
    <p><b>伴奏とドラム</b>：譜面の上の〈伴奏〉〈ドラム〉を押して選びます。拍子に合うものだけが並びます。コードが変わる所では、型の途中でも新しいコードで鳴ります。伴奏は拍の頭をいちばん強く、裏をほんの少し弱く弾きます。裏で弾いてすぐ後の強い位置を休む所（シンコペーション）は、拍の頭と同じ強さで弾きます。ドラムは、曲の頭・区切りの頭・区切りの中の4小節ごとの頭でシンバルを鳴らします。ドラムの音は ScoreLineTAB と同じ録音（MusyngKite、CC BY-SA 3.0）を使い、読み込めない時は Versilian Studios「Virtuosity Drums」（CC0）の録音で鳴らします。</p>
    <p><b>ピアノロール</b>：譜面の上の〈ピアノロール〉で小窓が開きます。縦が音の高さ（五線譜に書いた高さ）、横が時間です。〈伴奏の音〉で、コードの音を薄い帯で重ねます。〈−〉〈＋〉で横を縮める・広げる、見出しを持って動かす、右下の角で大きさを変えることができます。</p>
    <p><b>コード図</b>：譜面の上の〈コード図〉で、出さない・コードの下・曲名の下（使うコードの一覧）を選べます。図を押すと押さえを変えられ、伴奏のギターもその押さえで鳴ります。既定は〈この箇所だけ〉で、〈この曲のこのコード全部〉にも切り替えられます。伴奏がピアノの時は図だけが変わります。</p>
    <p><b>ドラムを打ち込む</b>：型は 4分・8ビート・16ビート・トリプレット・8シャッフル・16シャッフルの6つで、拍子に合わせて伸び縮みします。下の帯の上に、いま触っている所の型のマスが出ます。マスを押して形を直せます（曲ごと・拍子ごとに覚え、〈元に戻す〉で最初の形に戻ります）。行はクラッシュ・ライド・ハイハット・スネア・バスドラムで、〈＋ ほかの音〉でオープンハイハット・リム・ハイタム・ロータムも出せます。〈タイト〉はドラム全体の響きを短く止めます。マスは〈畳む〉でしまえ、〈ドラム〉の画面の〈マスを出す〉で出し直せます。その小節だけ叩き方を変えたい時は、小節の番号を押して〈この小節のドラムを打ち込む〉を選びます。シンバルを「自動も入れる」にすると、区切りの頭・4小節ごとのシンバルと食いの合わせも足されます。「打ち込んだとおり」なら表のとおりにだけ鳴ります。</p>
    <p><b>小節</b>：左上の番号を押すと、その小節だけのテンポ・伴奏・ドラムの変更や、小節の追加・削除ができます。</p>
    <p><b>保存</b>：変更はこの端末に自動で保存されます。機種変更や受け渡しには〈書き出す〉〈読み込む〉を使ってください。</p>

<script>/* 共通の画面の部品（版 1.3 以上）が読めた時だけ、真鍮の羅針盤と海図にする */
(function(){
  if(!(window.DS&&DS.ui&&parseFloat(DS.ui.version)>=1.3&&DS.ui.compass))return;
  var b=document.body;b.classList.add('ds-chart','sl-ch');b.setAttribute('data-ds-enter','off');
  DS.ui.init(b);
  var T=document.getElementById('title');if(!T)return;
  var el=document.createElement('div');el.id='sl-compass';T.parentNode.insertBefore(el,T.nextSibling);
  var c=DS.ui.compass(el,{
    onSeek:function(t,done){var tl=curTimeline();if(!tl||!tl.total)return;if(done)seekTo(t/tl.total);else{playPos=t;updSeek(tl);}},
    onCue:function(t,done){cueDrag=!done;cueSet(t,!done);if(!playing){playPos=cueSec();updSeek(curTimeline());}}});
  /* 曲の形（小節の時刻と目印）は、時刻表が作り直された時だけ渡す */
  var lastTl=null,lastMk='';
  function shape(){
    var tl=TLC.tl,s=song();if(!tl||!s||!tl.bars.length)return null;
    var mk={};s.sections.forEach(function(sec){sec.bars.forEach(function(x){if(x.mark)mk[x.id]=x.mark;});});
    var marks=[];tl.bars.forEach(function(x,i){if(mk[x.id])marks.push({bar:i,name:mk[x.id]});});
    var k=JSON.stringify(marks);if(tl===lastTl&&k===lastMk)return tl;lastTl=tl;lastMk=k;
    c.set({bars:tl.bars.map(function(x){return {t:x.t,dur:x.dur,nb:x.nb};}),total:tl.total,marks:marks});return tl;
  }
  window.SL_CH_RENDER=function(){b.classList.toggle('sl-list',S.view==='list');if(S.view!=='list'){try{curTimeline();}catch(e){}shape();}};
  (function loop(){try{if(S.view!=='list'){var tl=shape();if(tl){c.pos(playPos);c.cue(cueSec(tl));}}}catch(e){}requestAnimationFrame(loop);})();
  SL_CH_RENDER();
})();
</script>
